on:
  workflow_dispatch:
    inputs:
      state:
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: al-rank-probe

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/al_rank_probe.mjs
            /scripts/scratch/country_members_lowest_power.json
            /scripts/scratch/alliance_rank_all.json
            /scripts/scratch/alliance_rank_members.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          state=$(jq -r '.inputs.state // ""' "$GITHUB_EVENT_PATH")
          case "$state" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/al_rank_probe.mjs ${state:+--state=$state}
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
