on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする gameUid（kind deleted の行）
        required: true
      version:
        description: ログインで名乗る版（空なら 1.0.438）
        required: false
        default: ""

concurrency:
  group: tool-fetch-config
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/fetch_config.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOGIN: ${{ inputs.login }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            "" | [0-9]*.[0-9]*.[0-9]*) ;;
            *) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/fetch_config.mjs "$LOGIN" "$VERSION"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
