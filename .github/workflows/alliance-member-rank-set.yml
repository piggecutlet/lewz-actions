on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      rank:
        description: 階級 2〜4
        required: true
      leader:
        required: false
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/member_rank_set.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          rank=$(jq -r .inputs.rank "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          case "$rank" in
            2 | 3 | 4) ;;
            *) exit 1 ;;
          esac
          leader=$(jq -r '.inputs.leader // ""' "$GITHUB_EVENT_PATH")
          case "$leader" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/member_rank_set.mjs "$names" "$rank" ${leader:+"--leader=$leader"} --state="$STATE"
          }
          . .github/scripts/logged.sh
          run_logged main
