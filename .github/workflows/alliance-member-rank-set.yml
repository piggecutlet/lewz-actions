on:
  workflow_dispatch:
    inputs:
      names:
        description: gameUid（カンマ区切り）
        required: true
      rank:
        description: 階級 2〜4
        required: true
      leader:
        description: 盟主の gameUid（空なら州の自分の同盟）
        required: false
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/member_rank_set.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          rank=$(jq -r .inputs.rank "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!0-9,]*) exit 1 ;;
          esac
          case "$rank" in
            2 | 3 | 4) ;;
            *) exit 1 ;;
          esac
          leader=$(jq -r '.inputs.leader // ""' "$GITHUB_EVENT_PATH")
          case "$leader" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/member_rank_set.mjs "$names" "$rank" ${leader:+"--leader=$leader"} --state="$STATE"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟の階級を変え、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
