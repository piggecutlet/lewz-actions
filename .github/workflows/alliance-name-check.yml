on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      alliance:
        required: true
      abbr:
        required: true
      keys:
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/al_create.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          alliance=$(jq -r .inputs.alliance "$GITHUB_EVENT_PATH")
          case "$alliance" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          abbr=$(jq -r .inputs.abbr "$GITHUB_EVENT_PATH")
          case "$abbr" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          keys=$(jq -r ".inputs.keys // \"\"" "$GITHUB_EVENT_PATH")
          case "$keys" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/al_create.mjs "$name" "$alliance" "$abbr" "$keys"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟の作成を試し、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
