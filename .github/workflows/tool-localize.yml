on:
  workflow_dispatch:
    inputs:
      languages:
        description: 取る言語（アプリの言語コードをスペース区切り）
        required: false
        default: "en zh_CN ru tr ar"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/fetch_localize.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          languages=$(jq -r '.inputs.languages // "en zh_CN ru tr ar"' "$GITHUB_EVENT_PATH")
          for l in $languages; do
            [[ "$l" =~ ^[A-Za-z_]+$ ]] || exit 1
          done
          main() {
            cd src
            node scripts/core/fetch_localize.mjs $languages || exit 1
            for l in $languages; do
              git add --sparse "decompile/device/files/$l/${l}_ilocalize_base.json"
            done
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI で翻訳ファイルを取り直す（$languages）"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
          }
          . .github/scripts/logged.sh
          run_logged main
