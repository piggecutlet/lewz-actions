on:
  workflow_dispatch:
    inputs:
      id:
        required: false
        default: "259000"
      leader:
        description: 研究を始める表示名（その人の同盟で始める）
        default: Empire04c3a775

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/science_research.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LEADER: ${{ inputs.leader || 'Empire04c3a775' }}
        run: |
          id=$(jq -r '.inputs.id // "259000"' "$GITHUB_EVENT_PATH")
          case "$id" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          case "$LEADER" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/science_research.mjs "$id" --leader="$LEADER"
          }
          . .github/scripts/logged.sh
          run_logged main
