on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      force:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/leave_alliance.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          force=$(jq -r '.inputs.force // "false"' "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,\ ]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ "$force" = "true" ]; then node scripts/ci/leave_alliance.mjs "$names" --force; else node scripts/ci/leave_alliance.mjs "$names"; fi
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟を脱退させ、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
