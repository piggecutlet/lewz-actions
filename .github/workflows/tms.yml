on:
  workflow_dispatch:
    inputs:
      count:
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
      chained:
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      approver:
        description: 加入の承認役（空なら 775 の Empire064d8775。ほかの州は必須）
        required: false
        default: ""
      captain:
        description: 小隊長（空なら 775 の Empire064d9775。ほかの州は必須）
        required: false
        default: ""
      alliance:
        description: 自分の同盟の ID（空なら 775 の 775_002。ほかの州は必須）
        required: false
        default: ""

concurrency:
  group: tms-${{ inputs.alliance || '775_002' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /CI_SKIP
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.system.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          CHAINED: ${{ inputs.chained && '--chained' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          APPROVER: ${{ inputs.approver }}
          CAPTAIN: ${{ inputs.captain }}
          ALLIANCE: ${{ inputs.alliance }}
        run: |
          case "$COUNT" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$APPROVER$CAPTAIN$ALLIANCE" in
            *[!A-Za-z0-9_]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_tms_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          echo "LOG=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node scripts/core/tms.mjs $COUNT $DRY_RUN $CHAINED --ci --state="$STATE" ${APPROVER:+"--approver=$APPROVER"} ${CAPTAIN:+"--captain=$CAPTAIN"} ${ALLIANCE:+"--alliance=$ALLIANCE"}
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          echo "CODE=$?" >> "$GITHUB_ENV"

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          set +e
          (
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の tms で accounts.json を更新する'))"
          ) >> "$LOG" 2>&1
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$LOG" -out "${LOG%.log}"
          rm "$LOG"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit "${CODE:-1}"
