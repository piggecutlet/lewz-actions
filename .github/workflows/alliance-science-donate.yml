on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      args:
        description: science.mjs へ表示名の後ろに渡す引数（例 none --only=259000 --gold-limit --gold-slot）
        required: false
        default: none

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          args=$(jq -r '.inputs.args // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          case "$args" in
            *[!A-Za-z0-9=,\ -]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/science.mjs "$names" $args
          }
          . .github/scripts/logged.sh
          run_logged main
