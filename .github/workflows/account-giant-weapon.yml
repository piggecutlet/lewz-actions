on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名,表示名,...
        required: true
      dry_run:
        description: 送る予定のものを出すだけ（書き込みなし）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          [[ "$names" =~ ^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$ ]] || exit 1
          opt=""
          if [ "$DRY_RUN" = "true" ]; then
            opt="--dry-run"
          fi
          main() {
            cd src && node scripts/core/giant_weapon.mjs "$names" $opt
          }
          . .github/scripts/logged.sh
          run_logged main
