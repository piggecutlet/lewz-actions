on:
  workflow_dispatch:
    inputs:
      to:
        description: 受け手の gameUid
        required: true
      from:
        description: 送り手の gameUid
        required: true
      mode:
        type: choice
        options:
          - push
          - overwrite
        default: push

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            scripts/ci
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          to=$(jq -r .inputs.to "$GITHUB_EVENT_PATH")
          from=$(jq -r .inputs.from "$GITHUB_EVENT_PATH")
          mode=$(jq -r .inputs.mode "$GITHUB_EVENT_PATH")
          case "$mode" in
            push | overwrite) ;;
            *) exit 1 ;;
          esac
          for n in "$to" "$from"; do
            case "$n" in
              "" | *[!0-9]*) exit 1 ;;
            esac
          done
          main() {
            cd src/scripts/ci/fcm_push_test
            npx -y pnpm@12.15.0 install --frozen-lockfile --ignore-scripts
            node "fcm_${mode}_test.mjs" "$to" "$from"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
