on:
  workflow_dispatch:
    inputs:
      count:
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false
      chained:
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      approver:
        description: 加入の承認役（空なら 775 の Empire064d8775。ほかの州は必須）
        required: false
        default: ""
      captain:
        description: 小隊長（空なら 775 の Empire064d9775。ほかの州は必須）
        required: false
        default: ""
      alliance:
        description: 自分の同盟の ID（空なら 775 の 775_002。ほかの州は必須）
        required: false
        default: ""

concurrency:
  group: vip-alliance-gift-${{ inputs.alliance || '775_002' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.system.xml

      - env:
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          CHAINED: ${{ inputs.chained && '--chained' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          APPROVER: ${{ inputs.approver }}
          CAPTAIN: ${{ inputs.captain }}
          ALLIANCE: ${{ inputs.alliance }}
        run: |
          case "$COUNT" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$APPROVER$CAPTAIN$ALLIANCE" in
            *[!A-Za-z0-9_]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/vip_alliance_gift.mjs $COUNT $DRY_RUN $CHAINED --ci --state="$STATE" ${APPROVER:+"--approver=$APPROVER"} ${CAPTAIN:+"--captain=$CAPTAIN"} ${ALLIANCE:+"--alliance=$ALLIANCE"}
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          STATE: ${{ inputs.state || '775' }}
          ALLIANCE: ${{ inputs.alliance || '775_002' }}
        run: |
          set +e
          (
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-alliance-gift-cycle で accounts.json を更新する'))"
          ) >> "$LOG" 2>&1
          if [ "$JOB_STATUS" = cancelled ]; then
            if gh workflow run account-setup-cancel.yml -R "$GITHUB_REPOSITORY" -f started="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt -q .startedAt)" -f state="$STATE" -f alliance="$ALLIANCE" >> "$LOG" 2>&1; then
              echo "account-setup-cancel.yml を起動した" >> "$LOG"
            else
              echo "account-setup-cancel.yml を起動できなかった。この run で作った件が同盟に残っていないか確かめる" >> "$LOG"
            fi
          fi
          set -e
          . .github/scripts/logged.sh
          finish_logged
