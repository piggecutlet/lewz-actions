on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 押さえている側の gameUid:新しい側の gameUid をカンマ区切り
        required: true
      team:
        description: 小隊の teamId
        required: true

concurrency:
  group: setup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/swap_seat.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          pairs=$(jq -r .inputs.pairs "$GITHUB_EVENT_PATH")
          team=$(jq -r .inputs.team "$GITHUB_EVENT_PATH")
          case "$pairs" in
            "" | *[!A-Za-z0-9:,]*) exit 1 ;;
          esac
          case "$team" in
            "" | *[!0-9a-f]*) exit 1 ;;
          esac
          main() {
            cd src
            for pair in ${pairs//,/ }; do
              node scripts/ci/swap_seat.mjs "${pair%%:*}" "${pair##*:}" "$team" || exit 1
            done
          }
          . .github/scripts/logged.sh
          run_logged main
