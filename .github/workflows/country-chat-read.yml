on:
  workflow_dispatch:
    inputs:
      login:
        description: ログイン元の gameUid
        required: true
      state:
        description: 州（国際チャット country_<州> を読む）
        required: true

permissions:
  contents: write

concurrency:
  group: country-chat-read-${{ github.event.inputs.login }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/country_chat_read.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r .inputs.login "$GITHUB_EVENT_PATH")
          state=$(jq -r .inputs.state "$GITHUB_EVENT_PATH")
          case "$login$state" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/country_chat_read.mjs "$login" "$state"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
