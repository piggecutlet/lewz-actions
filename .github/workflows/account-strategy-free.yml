on:
  workflow_dispatch:
    inputs:
      name:
        description: 表示名
        required: true
      probe:
        description: 無料を使い切ったあとに useFree 1 でもう 1 回ずつ送る（調べるとき用）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          PROBE: ${{ inputs.probe }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          [[ "$name" =~ ^[A-Za-z0-9]+$ ]] || exit 1
          opt=""
          if [ "$PROBE" = "true" ]; then
            opt="--probe"
          fi
          main() {
            cd src && node scripts/core/strategy_free.mjs "$name" $opt
          }
          . .github/scripts/logged.sh
          run_logged main
