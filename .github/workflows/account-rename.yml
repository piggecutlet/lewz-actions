on:
  workflow_dispatch:
    inputs:
      uid:
        description: gameUid
        required: true
      name:
        description: 新しい名前（英数字と空白）。random なら Tmp + 数字 5 桁。check_only ならカンマ区切りで複数
        required: true
      check_only:
        description: 改名せず、名前が使えるかだけ確かめる
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          CHECK_ONLY: ${{ inputs.check_only && '--check-only' || '' }}
        run: |
          uid=$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")
          case "$uid" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9\ ,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/rename.mjs "$uid" "$name" $CHECK_ONLY
            code=$?
            git add scripts/core/taken_names.json
            if ! git diff --cached --quiet -- scripts/core/taken_names.json; then
              git commit -m "chore: CI で使えなかった名前を taken_names.json に控える" -- scripts/core/taken_names.json
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で改名し、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
