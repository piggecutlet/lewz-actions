on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      target:
        description: DF の移転先と偵察先 x,y（空なら scripts/ci/ci_defaults.mjs の DF_TARGET）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/farm_finish.mjs
            /scripts/ci/ci_defaults.mjs
            /scripts/ci/scout.mjs
            /decompile/obb/assets/WorldMap.tmx

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          target=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
          [[ -z "$target" || "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          main() {
            cd src
            node scripts/ci/farm_finish.mjs "$names" $target
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の DF の仕上げで accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
