on:
  workflow_dispatch:
    inputs:
      kinds:
        description: ジョブごとに回す kind（JSON の配列。要素はカンマ区切りの kind）
        default: '["other"]'
      state:
        description: 州
        default: "775"

concurrency:
  group: core-hunt-${{ inputs.kinds || '["other"]' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: ${{ fromJSON(inputs.kinds || '["other"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          KIND: ${{ matrix.kind }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          kind="$KIND"
          case "$kind" in
            "" | *[!a-z,]*) exit 1 ;;
          esac
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/core_hunt.mjs --kind="$kind" --state="$STATE"
          }
          . .github/scripts/logged.sh
          start_logged main "${kind//,/-}"
          code=$CODE
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          if [ $code -eq 2 ]; then
            echo "dropped=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - name: レスポンスコアが落ちた
        if: env.dropped == '1'
        run: exit 1

      - if: always()
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] && [ -d src ] || exit 0
          (
            cd src
            node scripts/core/core_hunt.mjs --push
          ) >> "$LOG" 2>&1 || true

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] || exit 0
          . .github/scripts/logged.sh
          CODE=0
          finish_logged

  next:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          kinds=$(jq -r '.inputs.kinds // "[\"other\"]"' "$GITHUB_EVENT_PATH")
          n=""
          for i in 1 2 3 4 5; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select((.name == "時間切れ" and .conclusion == "success") or (.name == "レスポンスコアが落ちた" and .conclusion == "failure"))] | length') && break
            n=""
            echo "run の結果を読めなかったので 30 秒後にやり直す（$i 回目）"
            sleep 30
          done
          if [ -z "$n" ]; then
            echo "run の結果を 5 回とも読めなかった"
            exit 1
          fi
          if [ "$n" -gt 0 ]; then
            for i in 1 2 3 4 5; do
              if gh workflow run core-hunt.yml -R "$GITHUB_REPOSITORY" -f kinds="$kinds" -f state="$STATE"; then
                echo "続きを起動した"
                exit 0
              fi
              echo "続きを起動できなかったので 30 秒後にやり直す（$i 回目）"
              sleep 30
            done
            echo "続きを 5 回とも起動できなかった"
            exit 1
          fi
