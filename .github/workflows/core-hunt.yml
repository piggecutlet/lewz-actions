# レスポンスコア用アカウント（kind core）でゾンビを倒し続け、レスポンスコアが落ちるかを確かめる（scripts/core/core_hunt.mjs）
#   5 時間で区切り、続きがあれば自分をもう一度起動する。落ちたら終了コード 2 で止まる
#   kinds の 1 要素ごとに別のジョブ（別のランナー）で同時に回す。run は 1 本（2026-10-15 に matrix へ変えた）
#     1 つのジョブで落ちたら fail-fast でほかのジョブも止まり、続きは起動しない
on:
  workflow_dispatch:
    inputs:
      high:
        description: 低い Lv ではなく狙える一番高い Lv から倒す（--high）
        type: boolean
        default: false
      kinds:
        description: ジョブごとに回す kind（JSON の配列。要素はカンマ区切りの kind）
        default: '["core,sng,other","cnl"]'

concurrency:
  group: core-hunt-${{ inputs.kinds || '["core,sng,other","cnl"]' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: ${{ fromJSON(inputs.kinds || '["core,sng,other","cnl"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          KIND: ${{ matrix.kind }}
        run: |
          mkdir -p logs
          high=$(jq -r '.inputs.high // "false"' "$GITHUB_EVENT_PATH")
          case "$high" in
            true) flag="--high" ;;
            false) flag="" ;;
            *) exit 1 ;;
          esac
          kind="$KIND"
          case "$kind" in
            "" | *[!a-z,]*) exit 1 ;;
          esac
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_core-hunt_${kind//,/-}_${GITHUB_RUN_ID}.log"
          # 途中で止めても次のステップで途中までのログを残せるように渡す
          echo "log=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            node scripts/core/core_hunt.mjs $flag --kind="$kind"
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          # 3 は時間切れ。次の「時間切れ」のステップを動かして、next のジョブに続きを起動してもらう
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      # next のジョブはこのステップの名前と成否を API で見る。名前を変えるときは next も直す
      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      # キャンセルや失敗でも、そこまでのログを暗号化してコミットする
      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$log" ] && [ -f "$log" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done

  # どれかのジョブが時間切れなら続きを起動する（同じ concurrency なので、この run が終わってから始まる）
  #   全ジョブが成功したときだけ。落ちた（終了コード 2）ときは起動しない
  next:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          high=$(jq -r '.inputs.high // "false"' "$GITHUB_EVENT_PATH")
          kinds=$(jq -r '.inputs.kinds // "[\"core,sng,other\",\"cnl\"]"' "$GITHUB_EVENT_PATH")
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length')
          if [ "$n" -gt 0 ]; then
            gh workflow run core-hunt.yml -R "$GITHUB_REPOSITORY" -f high="$high" -f kinds="$kinds"
            echo "続きを起動した"
          fi
