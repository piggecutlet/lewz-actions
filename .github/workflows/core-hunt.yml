# レスポンスコア用アカウント（kind core）でゾンビを倒し続け、レスポンスコアが落ちるかを確かめる（scripts/core/core_hunt.mjs）
#   5 時間で区切り、続きがあれば自分をもう一度起動する。落ちたら終了コード 2 で止まる
on:
  workflow_dispatch:
    inputs:
      high:
        description: 低い Lv ではなく狙える一番高い Lv から倒す（--high）
        type: boolean
        default: false
      kind:
        description: 回す kind（カンマ区切り）。kind ごとに別の run で同時に回せる
        default: core,sng,other,cnl

concurrency:
  group: core-hunt-${{ inputs.kind || 'core,sng,other,cnl' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          high=$(jq -r '.inputs.high // "false"' "$GITHUB_EVENT_PATH")
          case "$high" in
            true) flag="--high" ;;
            false) flag="" ;;
            *) exit 1 ;;
          esac
          kind=$(jq -r '.inputs.kind // "core,sng,other,cnl"' "$GITHUB_EVENT_PATH")
          case "$kind" in
            "" | *[!a-z,]*) exit 1 ;;
          esac
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_core-hunt_${kind//,/-}_${GITHUB_RUN_ID}.log"
          # 途中で止めても次のステップで途中までのログを残せるように渡す
          echo "log=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            node scripts/core/core_hunt.mjs $flag --kind="$kind"
            c=$?
            # 3 は時間切れ。続きを起動する（同じ concurrency なので、この run が終わってから始まる）
            if [ $c -eq 3 ]; then
              gh workflow run core-hunt.yml -R "$GITHUB_REPOSITORY" -f high="$high" -f kind="$kind" && echo "続きを起動した"
              c=0
            fi
            exit $c
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          exit $?

      # キャンセルや失敗でも、そこまでのログを暗号化してコミットする
      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$log" ] && [ -f "$log" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
