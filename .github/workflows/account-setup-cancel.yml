on:
  workflow_dispatch:
    inputs:
      started:
        required: true
      state:
        description: 州
        default: "775"
      alliance:
        description: 同盟の ID（vip-alliance-gift-cycle の後片付け。空なら account-setup の後片付け）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          STARTED: ${{ inputs.started }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          STATE: ${{ inputs.state || '775' }}
          ALLIANCE: ${{ inputs.alliance }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$ALLIANCE" in
            *[!0-9_]*) exit 1 ;;
          esac
          main() {
            cd src
            base=$(git rev-list -1 --before="$STARTED" HEAD)
            node scripts/core/setup_cancel.mjs "$base" --state="$STATE" ${ALLIANCE:+"--alliance=$ALLIANCE"}
            code=$?
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
