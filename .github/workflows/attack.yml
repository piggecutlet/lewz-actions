on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      target:
        description: 都市の座標（x,y）
        required: true
      teleport:
        description: 近くへ移転
        type: boolean
        default: false
      delete_account:
        description: 落とせたら削除申請
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /obb/assets/WorldMap.tmx
            /work/leave_random_move775.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          TELEPORT: ${{ inputs.teleport }}
          DELETE_ACCOUNT: ${{ inputs.delete_account }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          target=$(jq -r .inputs.target "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_attack_${GITHUB_RUN_ID}.log"
          end=$((SECONDS + 340 * 60))
          set +e
          (
            cd src
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "$TELEPORT" = "true" ]; then
              node scripts/core/teleport_near.mjs "$target" "$names" --diamond || { node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の attack で accounts.json を更新する'))"; exit 1; }
            fi
            out=$(node scripts/core/attack.mjs "$names" --target="$target")
            echo "$out"
            echo "$out" | grep -q "^種類 都市" || exit 1
            while [ $SECONDS -lt $end ]; do
              timeout $((end - SECONDS)) node scripts/core/attack.mjs "$names" --target="$target" --go
              code=$?
              [ $code -eq 3 ] || break
              echo "攻撃されたが都市の攻撃を続ける"
            done
            if grep -q "回目: 落ちた" "../$log"; then
              node -e '
                import("./scripts/core/_readme.mjs").then(({ readAccounts, writeAccounts }) => {
                  const names = process.argv[1].split(",");
                  const data = readAccounts();
                  for (const a of Object.values(data).flat()) {
                    if (!names.includes(a.name) || (a.note || "").includes("attack 済み")) continue;
                    a.note = a.note ? a.note + " / attack 済み" : "attack 済み";
                  }
                  writeAccounts(data);
                });
              ' "$names"
              if [ "$DELETE_ACCOUNT" = "true" ]; then
                node work/leave_random_move775.mjs "$names" || code=1
                node scripts/core/delete_account_ci.mjs "$names" || code=1
              fi
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の attack で accounts.json を更新する'))"
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w0
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
