on:
  workflow_dispatch:
    inputs:
      state:
        description: 州
        default: "775"

concurrency:
  group: setup-new-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/setup_new_state.mjs --state="$STATE"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          set +e
          (
            pkill -TERM -f 'scripts/(core|ci)/' && echo "まだ動いていた node を止めた"
            for i in $(seq 1 30); do
              pgrep -f 'scripts/(core|ci)/' > /dev/null || break
              sleep 1
            done
            pkill -KILL -f 'scripts/(core|ci)/'
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の /account:setup-new-state で accounts.json を更新する'))"
          ) >> "$LOG" 2>&1
          set -e
          . .github/scripts/logged.sh
          finish_logged
