on:
  workflow_dispatch:
    inputs:
      state:
        description: 州
        default: "775"

concurrency:
  group: setup-new-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/setup_new_state.mjs --state="$STATE"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の /account:setup-new-state で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
