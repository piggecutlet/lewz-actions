on:
  workflow_dispatch:
    inputs:
      names:
        required: true

concurrency:
  group: pray-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/core/pray_gold.mjs "$names"
          }
          . .github/scripts/logged.sh
          run_logged main
