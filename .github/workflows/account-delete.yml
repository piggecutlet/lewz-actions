on:
  workflow_dispatch:
    inputs:
      names:
        description: 空なら 7 日たった行へ 2 回目の申請
        required: false
        default: ""
      move:
        description: 申請の前に脱退と移転をする（同盟に入っていないなら不要）
        type: boolean
        default: true
      state:
        description: 州（脱退と移転で使う）
        default: "775"

concurrency:
  group: delete-account
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/leave_random_move775.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          MOVE: ${{ inputs.move }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            *[!A-Za-z0-9,\ ]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_delete_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            if [ -n "$names" ]; then
              if [ "$MOVE" != false ]; then
                node scripts/ci/leave_random_move775.mjs "$names" --state="$STATE" || exit 1
              fi
              node scripts/core/delete_account_ci.mjs "$names"
              code=$?
            else
              node scripts/core/delete_account.mjs
              code=$?
              node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の 2 回目の削除申請で accounts.json を更新する'))"
            fi
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          git pull --rebase
          git push
          exit $code
