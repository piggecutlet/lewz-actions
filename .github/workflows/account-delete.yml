on:
  workflow_dispatch:
    inputs:
      names:
        description: 空なら 7 日たった行へ 2 回目の申請
        required: false
        default: ""
      move:
        description: 申請の前に脱退と移転をする（同盟に入っていないなら不要）
        type: boolean
        default: true
      state:
        description: 州（脱退と移転で使う）
        default: "775"

concurrency:
  group: delete-account
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/leave_random_move.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          MOVE: ${{ inputs.move }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            *[!A-Za-z0-9,\ ]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ -n "$names" ]; then
              if [ "$MOVE" != false ]; then
                node scripts/ci/leave_random_move.mjs "$names" --state="$STATE" || exit 1
              fi
              node scripts/core/delete_account_ci.mjs "$names"
              code=$?
            else
              node scripts/core/delete_account.mjs
              code=$?
              node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の 2 回目の削除申請で accounts.json を更新する'))"
            fi
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
