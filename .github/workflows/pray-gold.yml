on:
  workflow_dispatch:
    inputs:
      names:
        required: true

concurrency:
  group: pray-gold
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M)_pray-gold_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (cd src && node scripts/core/pray_gold.mjs "$names") > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          git pull --rebase
          git push
          exit $code
