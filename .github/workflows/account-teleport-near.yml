on:
  workflow_dispatch:
    inputs:
      target:
        description: 移転先の座標（x,y）
        required: true
      names:
        required: true
      diamond:
        description: 高級移転が無ければダイヤ
        type: boolean
        default: false
      dry_run:
        description: 候補を近い順に 5 件出すだけ（移転しない）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/obb/assets/WorldMap.tmx

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DIAMOND: ${{ inputs.diamond }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          target=$(jq -r .inputs.target "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          opt=""
          if [ "$DIAMOND" = "true" ]; then
            opt="--diamond"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            opt="$opt --dry-run"
          fi
          main() {
            cd src
            node scripts/core/teleport_near.mjs "$target" "$names" $opt
            code=$?
            if [ "$DRY_RUN" = "true" ]; then
              exit $code
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の teleport-near で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
