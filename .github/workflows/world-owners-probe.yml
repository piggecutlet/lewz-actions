on:
  workflow_dispatch:
    inputs:
      login:
        default: ""
      state:
        default: "775"
      full:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
      from:
        default: ""

permissions:
  contents: write

concurrency:
  group: world-owners-probe

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/world_owners_probe.mjs
            /scripts/scratch/world_owners_*.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r '.inputs.login // ""' "$GITHUB_EVENT_PATH")
          state=$(jq -r '.inputs.state // "775"' "$GITHUB_EVENT_PATH")
          full=$(jq -r '.inputs.full // "false"' "$GITHUB_EVENT_PATH")
          dry=$(jq -r '.inputs.dry_run // "false"' "$GITHUB_EVENT_PATH")
          from=$(jq -r '.inputs.from // ""' "$GITHUB_EVENT_PATH")
          case "$login$state$from" in
            *[!0-9]*) exit 1 ;;
          esac
          flags="--state=$state"
          if [ -n "$login" ]; then
            flags="$flags --login=$login"
          fi
          if [ "$full" = "true" ]; then
            flags="$flags --full"
          fi
          if [ "$dry" = "true" ]; then
            flags="$flags --dry-run"
          fi
          if [ -n "$from" ]; then
            flags="$flags --from=$from"
          fi
          main() {
            cd src && node scripts/ci/world_owners_probe.mjs $flags
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
