on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/diamond_shield_read.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/diamond_shield_read.mjs "$names" --state="$STATE"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI でダイヤを読み、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
