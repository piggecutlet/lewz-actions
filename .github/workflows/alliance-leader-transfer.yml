on:
  workflow_dispatch:
    inputs:
      from:
        description: 今の盟主の表示名
        required: true
      to:
        description: 新しい盟主の表示名
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/leader_transfer.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          from=$(jq -r .inputs.from "$GITHUB_EVENT_PATH")
          to=$(jq -r .inputs.to "$GITHUB_EVENT_PATH")
          case "$from$to" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/leader_transfer.mjs "$from" "$to"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で盟主を譲り、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
