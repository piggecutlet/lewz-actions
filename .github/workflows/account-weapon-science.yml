on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      node:
        required: true
      dry_run:
        required: false
        default: "true"
      instant:
        required: false
        default: "false"
      repeat:
        required: false
        default: "false"

concurrency:
  group: weapon-science
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/weapon_science.mjs
            /scripts/ci/officer_key.mjs
            /scripts/ci/item_buy.mjs
            /web/scripts/
            /web/item-measured.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          node=$(jq -r .inputs.node "$GITHUB_EVENT_PATH")
          dry=$(jq -r '.inputs.dry_run // "true"' "$GITHUB_EVENT_PATH")
          [[ "$name" =~ ^[0-9]+$ ]] || exit 1
          [[ "$node" =~ ^[0-9]+(,[0-9]+)*$ ]] || exit 1
          instant=$(jq -r '.inputs.instant // "false"' "$GITHUB_EVENT_PATH")
          repeat=$(jq -r '.inputs.repeat // "false"' "$GITHUB_EVENT_PATH")
          flag=""
          [ "$dry" = "true" ] && flag="--dry-run"
          [ "$instant" = "true" ] && flag="$flag --instant"
          main() {
            cd src
            if [ "$repeat" != "true" ]; then
              node scripts/ci/weapon_science.mjs "$name" "$node" $flag
              return
            fi
            buy=0
            keys=0
            list=(${node//,/ })
            for idx in "${!list[@]}"; do
              n=${list[$idx]}
              done_lv=0
              while [ "$done_lv" -lt 40 ]; do
                if [ "$SECONDS" -gt 16800 ]; then
                  rest=$(IFS=,; echo "${list[*]:$idx}")
                  gh workflow run account-weapon-science.yml -R "$GITHUB_REPOSITORY" -f name="$name" -f node="$rest" -f dry_run="$dry" -f instant="$instant" -f repeat="$repeat" || return 1
                  echo "4 時間 40 分を超えたので、残り $rest を次の run へ引き継ぐ"
                  return 0
                fi
                rc=0
                node scripts/ci/weapon_science.mjs "$name" "$n" $flag || rc=$?
                if [ "$rc" = "0" ]; then
                  done_lv=$((done_lv + 1))
                elif [ "$rc" = "3" ]; then
                  break
                elif [ "$rc" = "4" ]; then
                  buy=$((buy + 1))
                  [ "$buy" -gt 60 ] && return 4
                  rc=0
                  node scripts/ci/item_buy.mjs "$name" 206057:10000 || rc=$?
                  if [ "$rc" != "0" ]; then
                    keys=$((keys + 1))
                    [ "$keys" -gt 80 ] && return 5
                    node scripts/ci/officer_key.mjs "$name" 4000000 --no-gift || return $?
                    node scripts/ci/item_buy.mjs "$name" 206057:10000 || return $?
                  fi
                elif [ "$rc" = "5" ]; then
                  keys=$((keys + 1))
                  [ "$keys" -gt 80 ] && return 5
                  node scripts/ci/officer_key.mjs "$name" 4000000 --no-gift || return $?
                else
                  return "$rc"
                fi
              done
            done
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
