on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      node:
        required: true
      dry_run:
        required: false
        default: "true"
      instant:
        required: false
        default: "false"
      repeat:
        required: false
        default: "false"

concurrency:
  group: weapon-science
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/weapon_science.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          node=$(jq -r .inputs.node "$GITHUB_EVENT_PATH")
          dry=$(jq -r '.inputs.dry_run // "true"' "$GITHUB_EVENT_PATH")
          [[ "$name" =~ ^[0-9]+$ ]] || exit 1
          [[ "$node" =~ ^[0-9]+(,[0-9]+)*$ ]] || exit 1
          instant=$(jq -r '.inputs.instant // "false"' "$GITHUB_EVENT_PATH")
          repeat=$(jq -r '.inputs.repeat // "false"' "$GITHUB_EVENT_PATH")
          flag=""
          [ "$dry" = "true" ] && flag="--dry-run"
          [ "$instant" = "true" ] && flag="$flag --instant"
          main() {
            cd src
            if [ "$repeat" != "true" ]; then
              node scripts/ci/weapon_science.mjs "$name" "$node" $flag
              return
            fi
            for n in ${node//,/ }; do
              for i in $(seq 1 40); do
                rc=0
                node scripts/ci/weapon_science.mjs "$name" "$n" $flag || rc=$?
                [ "$rc" = "3" ] && break
                [ "$rc" != "0" ] && return "$rc"
              done
            done
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
