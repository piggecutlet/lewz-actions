on:
  workflow_dispatch:
    inputs:
      names:
        description: 送る側の表示名（カンマ区切り）
        required: true
      to:
        description: 受ける側の 表示名:gameUid（空なら 775 の Empire061775。ほかの州は必須）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[[:space:]]* | *\"* | *\'* | *\`* | *\$* | *'\'*) exit 1 ;;
          esac
          to=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          case "$to" in
            *[!A-Za-z0-9:]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/gift_cores.mjs "$names" ${to:+"--to=$to"}
          }
          . .github/scripts/logged.sh
          run_logged main
