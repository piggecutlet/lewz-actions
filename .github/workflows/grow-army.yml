on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      mode:
        type: choice
        default: 既定
        options:
          - 既定
          - 4種
          - Lv.1
          - ゾンビのみ
          - Lv.9 車両
          - Lv.10 車両
          - Lv.10 射手
          - Lv.9 射手
          - DF
          - core
      target:
        description: DF の移転先と偵察先 x,y（空なら ci.json の dfTarget、なしなら後回し）
        required: false
        default: ""
      rose:
        required: false
        default: ""
      delete_account:
        description: 削除申請
        type: boolean
        default: false
      double_advanced:
        description: 高級移転を 2 個まで買う
        type: boolean
        default: false
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /work/skill_box_train_verify775.mjs
            /work/scout775.mjs
            /work/df_finish775.mjs
            /decompile/obb/assets/WorldMap.tmx
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DELETE_ACCOUNT: ${{ inputs.delete_account && '--delete-account' || '' }}
          DOUBLE_ADVANCED: ${{ inputs.double_advanced && '--double-advanced' || '' }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mode=$(jq -r .inputs.mode "$GITHUB_EVENT_PATH")
          [ "$mode" = 既定 ] && mode=$(jq -r .growArmy src/savedata/ci.json)
          case "$mode" in
            4種) flag="" ;;
            Lv.1) flag="--lv1" ;;
            ゾンビのみ) flag="--zombie-only" ;;
            "Lv.9 車両") flag="--harvester-only" ;;
            "Lv.10 車両") flag="--vehicle-lv10" ;;
            "Lv.10 射手") flag="--archer-lv10" ;;
            "Lv.9 射手") flag="--archer-lv9" ;;
            core) flag="--core" ;;
            DF)
              target=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
              [ "$target" = なし ] && target=none
              [[ -z "$target" || "$target" = none || "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
              flag="--df${target:+=$target}"
              ;;
            *) exit 1 ;;
          esac
          rose=$(jq -r '.inputs.rose // ""' "$GITHUB_EVENT_PATH")
          case "$rose" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_grow-army_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node work/skill_box_train_verify775.mjs "$names" $flag --leave --parallel=60 ${rose:+"--rose=$rose"} $DELETE_ACCOUNT $DOUBLE_ADVANCED --state="$STATE"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の grow-army で accounts.json を更新する'))"
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
