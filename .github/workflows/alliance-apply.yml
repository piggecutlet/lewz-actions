on:
  workflow_dispatch:
    inputs:
      names:
        description: gameUid（カンマ区切り）
        required: true
      alliance:
        description: 申請先の同盟 ID（空なら 775 の SNG）
        required: false
      cancel:
        description: 申請を取り下げる
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!0-9,]*) exit 1 ;;
          esac
          alliance=$(jq -r '.inputs.alliance // ""' "$GITHUB_EVENT_PATH")
          [[ -z "$alliance" || "$alliance" =~ ^[0-9a-f]{32}$ ]] || exit 1
          cancel=
          [ "${{ inputs.cancel }}" = true ] && cancel=--cancel
          main() {
            cd src
            node scripts/core/apply_alliance.mjs "$names" ${alliance:+"--alliance=$alliance"} $cancel
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟へ加入申請し、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
