on:
  workflow_dispatch:
    inputs:
      state:
        required: false
      approver:
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          state=$(jq -r '.inputs.state // ""' "$GITHUB_EVENT_PATH")
          case "$state" in
            *[!0-9]*) exit 1 ;;
          esac
          approver=$(jq -r '.inputs.approver // ""' "$GITHUB_EVENT_PATH")
          case "$approver" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/vip_alliance_rank.mjs ${state:+"--state=$state"} ${approver:+"--approver=$approver"}
          }
          . .github/scripts/logged.sh
          run_logged main
