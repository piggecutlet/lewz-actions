on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 押さえている側:新しい側 をカンマ区切り（例 Empire04a775:Empire04c36775）
        required: true
      team:
        description: 小隊の teamId
        required: true

concurrency:
  group: setup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /work/swap_seat.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          pairs=$(jq -r .inputs.pairs "$GITHUB_EVENT_PATH")
          team=$(jq -r .inputs.team "$GITHUB_EVENT_PATH")
          case "$pairs" in
            "" | *[!A-Za-z0-9:,]*) exit 1 ;;
          esac
          case "$team" in
            "" | *[!0-9a-f]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_swap-seat_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            for pair in ${pairs//,/ }; do
              node work/swap_seat.mjs "${pair%%:*}" "${pair##*:}" "$team" || exit 1
            done
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
