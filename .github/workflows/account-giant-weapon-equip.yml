on:
  workflow_dispatch:
    inputs:
      name:
        description: gameUid
        required: true
      count:
        description: 付けて外す往復の数
        default: "10"
      goal:
        description: 最強要塞のポイントがこれを超えるまで回す（空なら count の回数だけ）
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/giant_weapon_equip.mjs
            /scripts/ci/giant_weapon_equip_points.json
            /decompile/device/files/WarZDoc/config/weapon_equip.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          target=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          count=$(jq -r .inputs.count "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+$ ]] || exit 1
          [[ "$count" =~ ^[0-9]+$ ]] || exit 1
          goal=$(jq -r '.inputs.goal // ""' "$GITHUB_EVENT_PATH")
          opt=""
          if [ -n "$goal" ]; then
            [[ "$goal" =~ ^[0-9]+$ ]] || exit 1
            opt="--target=$goal"
          fi
          main() {
            cd src && node scripts/core/giant_weapon.mjs "$target" && node scripts/ci/giant_weapon_equip.mjs "$target" "$count" $opt
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always()
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] && [ -d src ] || exit 0
          (
            cd src
            node scripts/ci/giant_weapon_equip.mjs --push
          ) >> "$LOG" 2>&1 || true

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
