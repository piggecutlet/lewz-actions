on:
  workflow_dispatch:
    inputs:
      state:
        description: 州
        default: "775"

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - timeout-minutes: 55
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            set -e
            cd src
            hour=$(TZ=JST-9 date +%H)
            if [ "$hour" -lt 12 ]; then slot=09; else slot=21; fi
            names=$(node -e "import('./scripts/core/_state.mjs').then(({stateOf})=>{console.log(stateOf(process.argv[1]).manual.join(','))})" "$STATE")
            node scripts/core/train_army.mjs "$names"
            node scripts/core/heal.mjs "$names"
            node scripts/core/build_trap.mjs "$names"
            node scripts/core/use_skill.mjs "$names" 240038 690006
            if [ "$(date -u +%H)" -lt 6 ]; then
              node scripts/core/use_skill.mjs "$names"
              node scripts/core/use_skill.mjs "$names" 240046 690013
            fi
            node scripts/core/city_def.mjs "$names"
            node scripts/core/mail_reward.mjs "$names" || true
            if [ "$slot" = 09 ]; then node scripts/core/strategy_free.mjs "$names" || true; fi
            if [ "$slot" = 09 ]; then
              for n in ${names//,/ }; do
                node scripts/core/weapon_troop_up.mjs "$n" --weapon=130202 --troop=4 --times=30 || true
              done
            fi
            node scripts/core/resource_collect.mjs "$names" || true
            if [ "$slot" = 21 ]; then node scripts/core/start_setup.mjs --state="$STATE" || true; fi
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
