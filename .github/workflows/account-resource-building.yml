on:
  workflow_dispatch:
    inputs:
      name:
        description: 表示名
        required: true
      build:
        description: 農地・油田・製鋼所・合金鉱山を 1 つずつ即時完成で建てる
        type: boolean
        default: false
      build_chip:
        description: 第一区にチップ工場を 1 つ即時完成で建てる
        type: boolean
        default: false
      collect:
        description: 資源施設を 1 棟ずつ回収する
        type: boolean
        default: false
      collect_all:
        description: build.collect.all で全部まとめて回収する
        type: boolean
        default: false
      collect_first:
        description: 種類ごとに最初の 1 棟だけ回収する（build.collect の type。空なら送らない）
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          BUILD: ${{ inputs.build }}
          BUILD_CHIP: ${{ inputs.build_chip }}
          COLLECT: ${{ inputs.collect }}
          COLLECT_ALL: ${{ inputs.collect_all }}
        run: |
          target=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[A-Za-z0-9]+$ ]] || exit 1
          opt=""
          if [ "$BUILD" = "true" ]; then
            opt="--build"
          fi
          if [ "$BUILD_CHIP" = "true" ]; then
            opt="$opt --build-chip"
          fi
          if [ "$COLLECT" = "true" ]; then
            opt="$opt --collect"
          fi
          if [ "$COLLECT_ALL" = "true" ]; then
            opt="$opt --collect-all"
          fi
          first=$(jq -r '.inputs.collect_first // ""' "$GITHUB_EVENT_PATH")
          [[ "$first" =~ ^[0-9]*$ ]] || exit 1
          if [ -n "$first" ]; then
            opt="$opt --collect-first=$first"
          fi
          main() {
            cd src && node scripts/core/resource_building.mjs "$target" $opt
          }
          . .github/scripts/logged.sh
          run_logged main
