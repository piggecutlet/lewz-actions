on:
  workflow_dispatch:
    inputs:
      name:
        description: gameUid
        required: true
      hero_id:
        description: 士官の heroId（省くと鉄壁車神 240065）
        default: "240065"
      card:
        description: その士官のカードの itemId（省くと鉄壁車神 206036）
        default: "206036"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/leader_unlock.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          hero=$(jq -r .inputs.hero_id "$GITHUB_EVENT_PATH")
          card=$(jq -r .inputs.card "$GITHUB_EVENT_PATH")
          for v in "$name" "$hero" "$card"; do
            case "$v" in
              "" | *[!0-9]*) exit 1 ;;
            esac
          done
          main() {
            cd src
            node scripts/ci/leader_unlock.mjs "$name" "$hero" "$card"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
