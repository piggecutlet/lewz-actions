on:
  workflow_dispatch:
    inputs:
      login:
        required: true
        default: Empire056e4775
      target:
        required: true

concurrency:
  group: find-user
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/find_user.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOGIN: ${{ inputs.login }}
          TARGET: ${{ inputs.target }}
        run: |
          main() {
            cd src
            node scripts/ci/find_user.mjs "$LOGIN" "$TARGET"
          }
          . .github/scripts/logged.sh
          run_logged main
