on:
  workflow_dispatch:
    inputs:
      names:
        description: gameUid（カンマ区切り）
        required: true
      goods:
        type: boolean
        default: false
      limit:
        default: ""

concurrency:
  group: item-buy-all
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            scripts/ci
            savedata
            web/scripts

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          [[ "$names" =~ ^[0-9]+(,[0-9]+)*$ ]] || exit 1
          flags=""
          [ "$(jq -r .inputs.goods "$GITHUB_EVENT_PATH")" = "true" ] && flags="--goods"
          limit=$(jq -r '.inputs.limit // ""' "$GITHUB_EVENT_PATH")
          [[ "$limit" =~ ^[0-9]*$ ]] || exit 1
          [ -n "$limit" ] && flags="$flags --limit=$limit"
          main() {
            cd src
            node scripts/ci/item_buy_all.mjs "$names" $flags
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
