on:
  workflow_dispatch:
    inputs:
      receivers:
        required: true
      senders:
        required: true

concurrency:
  group: rose
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          receivers=$(jq -r .inputs.receivers "$GITHUB_EVENT_PATH")
          senders=$(jq -r .inputs.senders "$GITHUB_EVENT_PATH")
          for v in "$receivers" "$senders"; do
            case "$v" in
              "" | *[!A-Za-z0-9,]*) exit 1 ;;
            esac
          done
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_rose.log"
          set +e
          (
            cd src
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node scripts/core/purple_rose.mjs "$receivers" "$senders"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の rose で accounts.json を更新する'))"
            exit $code
          ) > "$log" 2>&1
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          git pull --rebase
          git push
          exit $code
