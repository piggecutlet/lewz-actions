on:
  workflow_dispatch:
    inputs:
      uids:
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/state_open_date.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          uids=$(jq -r .inputs.uids "$GITHUB_EVENT_PATH" | tr ',' ' ')
          case "$uids" in
            "" | *[!0-9\ ]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/state_open_date.mjs $uids
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
