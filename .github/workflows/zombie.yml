on:
  workflow_dispatch:
    inputs:
      limit:
        description: 試し用。出撃の回数（全件の合計）。入れると日課を見ずにこの回数で止め、setup を起動しない
        required: false
        default: ""
      names:
        description: 試し用。表示名（カンマ区切り）。入れると小隊用アカウントの代わりに使う。小隊に入っていないアカウントは日課を読めないので limit が必須
        required: false
        default: ""
      server:
        description: 州
        default: "775"

concurrency:
  group: zombie
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          NAMES: ${{ inputs.names }}
          SERVER: ${{ inputs.server || '775' }}
        run: |
          case "$LIMIT" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$SERVER" in
            *[!0-9]*) exit 1 ;;
          esac
          if [ -n "$NAMES" ] && [ -z "$LIMIT" ]; then
            echo "names を入れるときは limit も入れてください"
            exit 1
          fi
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            team=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.kind===KIND.TEAM).map((a)=>a.name).filter((v)=>v).join(','))})" "$SERVER")
            if [ -n "$NAMES" ]; then
              team="$NAMES"
            fi
            if [ -n "$LIMIT" ]; then
              node scripts/core/zombie_hunt.mjs "$team" "$LIMIT" --diamond --ignore-task
              exit $?
            fi
            node scripts/core/zombie_hunt.mjs "$team" --diamond
            c=$?
            node scripts/core/start_setup.mjs --server="$SERVER"
            exit $c
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
