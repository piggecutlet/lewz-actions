on:
  workflow_dispatch:
    inputs:
      name:
        description: 送る側の表示名
        required: true
      to:
        description: 送信先（国際 か 同盟の略称）
        required: true
      msg:
        description: 本文
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          NAME: ${{ inputs.name }}
          TO: ${{ inputs.to }}
          MSG: ${{ inputs.msg }}
        run: |
          main() {
            cd src
            node scripts/core/chat_send.mjs "$TO" "$NAME" "$MSG"
          }
          . .github/scripts/logged.sh
          run_logged main
