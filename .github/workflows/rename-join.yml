on:
  workflow_dispatch:
    inputs:
      uid:
        required: true
      alliance:
        required: true
      nicks:
        required: true

concurrency:
  group: rename-join-${{ inputs.uid }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          uid=$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")
          case "$uid" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          alliance=$(jq -r .inputs.alliance "$GITHUB_EVENT_PATH")
          case "$alliance" in
            "" | *[!0-9a-f]*) exit 1 ;;
          esac
          nicks=$(jq -r .inputs.nicks "$GITHUB_EVENT_PATH")
          [ -n "$nicks" ] || exit 1
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_rename-join_${GITHUB_RUN_ID}.log"
          echo "log=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node scripts/core/rename_join.mjs "$uid" "$alliance" "$nicks"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で改名と同盟への加入を見張り、accounts.json を更新する'))"
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$log" ] && [ -f "$log" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done

  next:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length')
          if [ "$n" -gt 0 ]; then
            gh workflow run rename-join.yml -R "$GITHUB_REPOSITORY" -f uid="$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")" -f alliance="$(jq -r .inputs.alliance "$GITHUB_EVENT_PATH")" -f nicks="$(jq -r .inputs.nicks "$GITHUB_EVENT_PATH")"
            echo "続きを起動した"
          fi
