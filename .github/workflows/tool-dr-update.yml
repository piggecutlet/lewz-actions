on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする gameUid（kind deleted の行）
        required: true

concurrency:
  group: tool-dr-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/dr_update.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOGIN: ${{ inputs.login }}
        run: |
          main() {
            cd src
            node scripts/ci/dr_update.mjs "$LOGIN"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
