on:
  workflow_dispatch:
    inputs:
      name:
        description: gameUid
        required: true
      make:
        description: 作る巨大武器の armId（空なら作らない。130202 は夜明けの方舟）
        default: ""
      weapon:
        description: 強化する巨大武器の armId（空なら強化しない）
        default: ""
      troop:
        description: 兵種改造の type（空なら改造しない。4 はゾンビ）
        default: ""
      times:
        description: 強化と改造の回数
        default: "10"
      buy:
        description: 最初に item.buy で買うもの（<itemId>:<数>,...。空なら買わない）
        default: ""
      hot_buy:
        description: hot.item.buy で買うもの（<itemId>:<数>:<1 個の値段>,...。空なら買わない）
        default: ""
      open_each:
        description: 自選箱を中身の候補ごとに 1 個ずつ開ける（<箱の itemId>,...。空なら開けない）
        default: ""
      use_items:
        description: 持っている分を 1 個ずつ使うアイテム（<itemId>,...。空なら使わない）
        default: ""
      skin_act:
        description: スキンリストで有効にする状態 ID を有効にしたい順に（<状態 ID>,...。空なら有効にしない）
        default: ""
      skin_deact:
        description: スキンリストから外す状態 ID（<状態 ID>,...。skin_act より先に外す。空なら外さない）
        default: ""
      attack_castle:
        description: スキンのあとにそのマスの城を 1 回攻撃して戦闘報告の効果の値を出す（x,y。空なら攻撃しない。自分の削除申請済みの城だけ）
        default: ""
      castle_troop:
        description: 城を攻撃する前に即時訓練で足す兵種の armId（空なら Lv.1 の戦士 107000）
        default: ""
      castle_num:
        description: その兵種の待機兵をこの数まで足す（空なら 1 部隊の上限まで）
        default: ""
      items:
        description: 持っているアイテムを全部出す
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          target=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+$ ]] || exit 1
          opt=""
          for key in make weapon troop times; do
            value=$(jq -r ".inputs.$key // \"\"" "$GITHUB_EVENT_PATH")
            [[ "$value" =~ ^[0-9]*$ ]] || exit 1
            if [ -n "$value" ]; then
              opt="$opt --$key=$value"
            fi
          done
          buy=$(jq -r '.inputs.buy // ""' "$GITHUB_EVENT_PATH")
          [[ "$buy" =~ ^[0-9:,]*$ ]] || exit 1
          if [ -n "$buy" ]; then
            opt="$opt --buy=$buy"
          fi
          hot=$(jq -r '.inputs.hot_buy // ""' "$GITHUB_EVENT_PATH")
          [[ "$hot" =~ ^[0-9:,]*$ ]] || exit 1
          if [ -n "$hot" ]; then
            opt="$opt --hot-buy=$hot"
          fi
          open=$(jq -r '.inputs.open_each // ""' "$GITHUB_EVENT_PATH")
          [[ "$open" =~ ^[0-9,]*$ ]] || exit 1
          if [ -n "$open" ]; then
            opt="$opt --open-each=$open"
          fi
          for key in use_items skin_act skin_deact castle_troop castle_num; do
            value=$(jq -r ".inputs.$key // \"\"" "$GITHUB_EVENT_PATH")
            [[ "$value" =~ ^[0-9,]*$ ]] || exit 1
            if [ -n "$value" ]; then
              opt="$opt --${key//_/-}=$value"
            fi
          done
          castle=$(jq -r '.inputs.attack_castle // ""' "$GITHUB_EVENT_PATH")
          [[ "$castle" =~ ^([0-9]+,[0-9]+)?$ ]] || exit 1
          if [ -n "$castle" ]; then
            opt="$opt --attack-castle=$castle"
          fi
          if [ "$(jq -r '.inputs.items // "false"' "$GITHUB_EVENT_PATH")" = "true" ]; then
            opt="$opt --items"
          fi
          main() {
            cd src && node scripts/core/weapon_troop_up.mjs "$target" $opt
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
