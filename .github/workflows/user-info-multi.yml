on:
  workflow_dispatch:
    inputs:
      login:
        required: true
      uids:
        required: true

permissions:
  contents: write

concurrency:
  group: user-info-multi

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/user_info_multi.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOGIN: ${{ inputs.login }}
          UIDS: ${{ inputs.uids }}
        run: |
          case "$LOGIN$UIDS" in
            *[!0-9,]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/user_info_multi.mjs --login=$LOGIN --uids=$UIDS
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
