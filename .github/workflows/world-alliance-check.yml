on:
  workflow_dispatch:
    inputs:
      login:
        required: true
      state:
        required: true
      limit:
        default: "0"

permissions:
  contents: write

concurrency:
  group: world-alliance-check

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/world_alliance_check.mjs
            /scripts/scratch/world_owners_*.json
            /scripts/scratch/world_alliance_check_*.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r '.inputs.login' "$GITHUB_EVENT_PATH")
          state=$(jq -r '.inputs.state' "$GITHUB_EVENT_PATH")
          limit=$(jq -r '.inputs.limit // "0"' "$GITHUB_EVENT_PATH")
          case "$login$state$limit" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/world_alliance_check.mjs --login=$login --state=$state --limit=$limit
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
