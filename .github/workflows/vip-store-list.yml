on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名（VIP 商店の一覧を読むだけ。買わない）
        required: true

permissions:
  contents: write

concurrency:
  group: vip-store-list
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - timeout-minutes: 10
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/vip_store_list.mjs "$names"
          }
          . .github/scripts/logged.sh
          run_logged main
