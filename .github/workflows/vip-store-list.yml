on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名（VIP 商店の一覧を読むだけ。買わない）
        required: true

permissions:
  contents: write

concurrency:
  group: vip-store-list
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.activity.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - timeout-minutes: 10
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_vip-store-list_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            node scripts/core/vip_store_list.mjs "$names"
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
