on:
  workflow_dispatch:
    inputs:
      uid:
        required: true
      alliance:
        required: true
      nicks:
        required: true

concurrency:
  group: rename-join-${{ inputs.uid }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          uid=$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")
          case "$uid" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          alliance=$(jq -r .inputs.alliance "$GITHUB_EVENT_PATH")
          case "$alliance" in
            "" | *[!0-9a-f]*) exit 1 ;;
          esac
          nicks=$(jq -r .inputs.nicks "$GITHUB_EVENT_PATH")
          [ -n "$nicks" ] || exit 1
          main() {
            cd src
            node scripts/core/rename_join.mjs "$uid" "$alliance" "$nicks"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で改名と同盟への加入を見張り、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main
          code=$CODE
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] || exit 0
          . .github/scripts/logged.sh
          CODE=0
          finish_logged

  next:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length')
          if [ "$n" -gt 0 ]; then
            gh workflow run account-rename-join.yml -R "$GITHUB_REPOSITORY" -f uid="$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")" -f alliance="$(jq -r .inputs.alliance "$GITHUB_EVENT_PATH")" -f nicks="$(jq -r .inputs.nicks "$GITHUB_EVENT_PATH")"
            echo "続きを起動した"
          fi
