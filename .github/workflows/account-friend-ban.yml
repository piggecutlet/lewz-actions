on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする gameUid
        required: true
      prefix:
        description: 名前の前半（番号の前まで）
        required: true
      from:
        required: true
      to:
        required: true

concurrency:
  group: friend-ban
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/friend_ban.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOGIN: ${{ inputs.login }}
          PREFIX: ${{ inputs.prefix }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          main() {
            cd src
            node scripts/ci/friend_ban.mjs "$LOGIN" "$PREFIX" "$FROM" "$TO"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
