on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      mode:
        type: choice
        default: 既定
        options:
          - 既定
          - 4種
          - Lv.1
          - ゾンビのみ
          - Lv.9 車両
          - Lv.10 車両
          - Lv.10 射手
          - Lv.9 射手
          - DF
          - core
      target:
        description: DF の移転先と偵察先 x,y（空なら scripts/ci/ci_defaults.mjs の DF_TARGET、なしなら後回し）
        required: false
        default: ""
      rose:
        required: false
        default: ""
      delete_account:
        description: 削除申請
        type: boolean
        default: false
      double_advanced:
        description: 高級移転を 2 個まで買う
        type: boolean
        default: false
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/grow_army.mjs
            /scripts/ci/ci_defaults.mjs
            /scripts/ci/scout.mjs
            /scripts/ci/farm_finish.mjs
            /decompile/obb/assets/WorldMap.tmx
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DELETE_ACCOUNT: ${{ inputs.delete_account && '--delete-account' || '' }}
          DOUBLE_ADVANCED: ${{ inputs.double_advanced && '--double-advanced' || '' }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mode=$(jq -r .inputs.mode "$GITHUB_EVENT_PATH")
          [ "$mode" = 既定 ] && mode=$(cd src && node --input-type=module -e 'import { GROW_ARMY } from "./scripts/ci/ci_defaults.mjs"; console.log(GROW_ARMY);')
          case "$mode" in
            4種) flag="" ;;
            Lv.1) flag="--lv1" ;;
            ゾンビのみ) flag="--zombie-only" ;;
            "Lv.9 車両") flag="--harvester-only" ;;
            "Lv.10 車両") flag="--vehicle-lv10" ;;
            "Lv.10 射手") flag="--archer-lv10" ;;
            "Lv.9 射手") flag="--archer-lv9" ;;
            core) flag="--core" ;;
            DF)
              target=$(jq -r '.inputs.target // ""' "$GITHUB_EVENT_PATH")
              [ "$target" = なし ] && target=none
              [[ -z "$target" || "$target" = none || "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
              flag="--df${target:+=$target}"
              ;;
            *) exit 1 ;;
          esac
          rose=$(jq -r '.inputs.rose // ""' "$GITHUB_EVENT_PATH")
          case "$rose" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/grow_army.mjs "$names" $flag --leave --parallel=60 ${rose:+"--rose=$rose"} $DELETE_ACCOUNT $DOUBLE_ADVANCED --state="$STATE"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の grow-army で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
