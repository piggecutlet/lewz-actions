on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする表示名（この人の同盟のメンバーを読む）
        required: true
      names:
        required: false
      write:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/member_xy.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r .inputs.login "$GITHUB_EVENT_PATH")
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          write=$(jq -r .inputs.write "$GITHUB_EVENT_PATH")
          case "$login" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ "$write" = "true" ]; then
              node scripts/ci/member_xy.mjs "$login" "$names" --write
              code=$?
              node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟の座標とランクを accounts.json に書く'))"
            else
              node scripts/ci/member_xy.mjs "$login" "$names"
              code=$?
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
