on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名（省くと R3 / VIP 10 の全件）
        required: false
      morning:
        description: 時刻に関係なく 9 時の回（解禁・商店・加速・派遣）を流す
        type: boolean
        default: false
      only_send_lv10_zombie:
        description: 送るのを Lv.10 ゾンビ ネメシスだけにする（1 万体に足りなければ送らない）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.activity.xml
            /work/gold_shield775.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - timeout-minutes: 120
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          morning=$(jq -r '.inputs.morning // "false"' "$GITHUB_EVENT_PATH")
          only_zombie=$(jq -r '.inputs.only_send_lv10_zombie // "false"' "$GITHUB_EVENT_PATH")
          send_opt=""
          if [ "$only_zombie" = "true" ]; then
            send_opt="--only-send-lv10-zombie"
          fi
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_vip_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            if [ -z "$names" ]; then
              names=$(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts})=>{console.log((readAccounts()['775']||[]).filter((a)=>a.note==='R3 / VIP 10').map((a)=>a.name).join(','))})")
            fi
            node scripts/core/shield.mjs "$names" || true
            if [ "$morning" = "true" ] || [ "$(TZ=JST-9 date +%H)" -lt 12 ]; then
              node scripts/core/vip_unlock.mjs "$names" || true
              node scripts/core/vip_store.mjs "$names" || true
              node scripts/core/use_skill.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" || true
              node scripts/core/vip_boost.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" || true
              node scripts/core/vip_send.mjs "$names" $send_opt || true
            else
              node scripts/core/train_army.mjs "$names" || true
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node work/gold_shield775.mjs "$names" || true
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip でダイヤを読み、accounts.json を更新する'))"
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
