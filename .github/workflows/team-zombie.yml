on:
  workflow_dispatch:
    inputs:
      limit:
        description: 試し用。出撃の回数（全件の合計）。入れると日課を見ずにこの回数で止め、setup を起動しない
        required: false
        default: ""
      names:
        description: 試し用。表示名（カンマ区切り）。入れると小隊用アカウントの代わりに使う。小隊に入っていないアカウントは日課を読めないので limit が必須
        required: false
        default: ""
      state:
        description: 州
        default: "775"

concurrency:
  group: zombie
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          NAMES: ${{ inputs.names }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$LIMIT" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          if [ -n "$NAMES" ] && [ -z "$LIMIT" ]; then
            echo "names を入れるときは limit も入れてください"
            exit 1
          fi
          main() {
            cd src
            team=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.kind===KIND.TEAM).map((a)=>a.name).filter((v)=>v).join(','))})" "$STATE")
            if [ -n "$NAMES" ]; then
              team="$NAMES"
            fi
            if [ -n "$LIMIT" ]; then
              node scripts/core/zombie_hunt.mjs "$team" "$LIMIT" --diamond --ignore-task
              exit $?
            fi
            node scripts/core/zombie_hunt.mjs "$team" --diamond
            c=$?
            node scripts/core/start_setup.mjs --state="$STATE"
            exit $c
          }
          . .github/scripts/logged.sh
          run_logged main
