on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      diamonds:
        required: true
      no_gift:
        required: false
        default: "false"

concurrency:
  group: officer-key
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/officer_key.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          diamonds=$(jq -r .inputs.diamonds "$GITHUB_EVENT_PATH")
          [[ "$name" =~ ^[0-9]+$ ]] || exit 1
          [[ "$diamonds" =~ ^[0-9]+$ ]] || exit 1
          no_gift=$(jq -r '.inputs.no_gift // "false"' "$GITHUB_EVENT_PATH")
          flag=""
          [ "$no_gift" = "true" ] && flag="$flag --no-gift"
          main() {
            cd src
            node scripts/ci/officer_key.mjs "$name" "$diamonds" $flag
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
