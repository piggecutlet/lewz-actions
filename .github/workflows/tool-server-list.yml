on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする gameUid（州一覧を読むために 1 件ログインする）
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/server_list.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r .inputs.login "$GITHUB_EVENT_PATH")
          case "$login" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/server_list.mjs "$login" || exit 1
            git add --sparse scripts/core/server_list.json scripts/core/server_list.js
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI で州一覧を取り直す"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
