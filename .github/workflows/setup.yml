on:
  workflow_dispatch:
    inputs:
      count:
        required: false
        default: ""
      delete_account:
        description: 1 回目の削除申請（この run で作った件）
        type: boolean
        default: true
      second_delete:
        description: 2 回目の削除申請（7 日たった件）
        type: boolean
        default: true
      grow_army:
        description: grow-army
        type: choice
        default: 既定
        options:
          - 既定
          - なし
          - 4種
          - Lv.1
          - ゾンビのみ
          - Lv.9 車両
          - Lv.10 車両
          - Lv.10 射手
          - Lv.9 射手
          - DF
          - core
          - VIP
          - VIP_NEW_ALLIANCE
      target:
        description: DF の移転先と偵察先 x,y（空なら ci.json の dfTarget、なしなら後回し）
        required: false
        default: ""
      sec:
        required: false
        default: ""
      seats:
        description: 使う枠の持ち主の表示名,...（空なら accounts.json の小隊用アカウント）
        required: false
        default: ""
      skip_build_base:
        description: build-base を飛ばす
        type: boolean
        default: false
      officer:
        description: 教官をランク 5
        type: boolean
        default: false
      force:
        description: 小隊の結晶の確かめを飛ばす
        type: boolean
        default: false
      dry_run:
        description: 1 周目に脱退させる件・作る件数・使う枠を出すだけ（何もしない）
        type: boolean
        default: false

concurrency:
  group: setup
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /CI_SKIP
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.system.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          COUNT: ${{ inputs.count }}
          DELETE_ACCOUNT: ${{ inputs.delete_account && '--delete-account' || '' }}
          SECOND_DELETE: ${{ inputs.second_delete && '--second-delete' || '' }}
          GROW_ARMY: ${{ inputs.grow_army }}
          SEC: ${{ inputs.sec }}
          TARGET: ${{ inputs.target }}
          SEATS: ${{ inputs.seats }}
          SKIP_BUILD_BASE: ${{ inputs.skip_build_base && '--skip-build-base' || '' }}
          OFFICER: ${{ inputs.officer && '--officer' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          case "$COUNT$SEC" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$SEATS" in
            *[!A-Za-z0-9,:]*) exit 1 ;;
          esac
          [[ -z "$TARGET" || "$TARGET" = なし || "$TARGET" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          GROW_ARMY_DEFAULT=""
          [ "$GROW_ARMY" = 既定 ] && GROW_ARMY=$(jq -r .growArmy src/savedata/ci.json) && GROW_ARMY_DEFAULT="--grow-army-default"
          case "$GROW_ARMY" in
            "" | なし) grow_army="" ;;
            4種 | Lv.1 | ゾンビのみ | "Lv.10 車両" | "Lv.10 射手" | "Lv.9 射手") grow_army="--grow-army=$GROW_ARMY" ;;
            "Lv.9 車両") grow_army="--grow-army=ハーベスター" ;;
            DF) grow_army="--grow-army=DF" ;;
            core) grow_army="--grow-army=core" ;;
            VIP) grow_army=""; OFFICER="--officer"; FIRE="--fire-initial" ;;
            VIP_NEW_ALLIANCE) grow_army=""; OFFICER="--officer"; FIRE="--fire-initial --no-teleport" ;;
            *) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_setup_${GITHUB_RUN_ID}.log"
          echo "LOG=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node scripts/core/new_dev.mjs $COUNT $DELETE_ACCOUNT $SECOND_DELETE ${grow_army:+"$grow_army"} $GROW_ARMY_DEFAULT ${TARGET:+"--target=$TARGET"} ${SEC:+"--sec=$SEC"} ${SEATS:+"--seats=$SEATS"} $SKIP_BUILD_BASE $OFFICER $FIRE $FORCE $DRY_RUN --ci
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          echo "CODE=$?" >> "$GITHUB_ENV"

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set +e
          (
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts())"
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
          ) >> "$LOG" 2>&1
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$LOG" -out "$LOG.enc"
          rm "$LOG"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit "${CODE:-1}"

      - if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: gh workflow run setup-cancel.yml -R "$GITHUB_REPOSITORY" -f started="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt -q .startedAt)"
