name: setup

on:
  workflow_dispatch:
    inputs:
      count:
        required: false
        default: ""
      delete_account:
        description: 削除申請
        type: boolean
        default: true
      grow_army:
        description: grow-army
        type: choice
        default: Lv.10 射手
        options:
          - なし
          - 4種
          - Lv.1
          - ゾンビのみ
          - Lv.9 車両
          - Lv.10 車両
          - Lv.10 射手
          - Lv.9 射手
      sec:
        required: false
        default: ""

concurrency:
  group: setup
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /CI_SKIP
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.system.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          COUNT: ${{ inputs.count }}
          DELETE_ACCOUNT: ${{ inputs.delete_account && '--delete-account' || '' }}
          GROW_ARMY: ${{ inputs.grow_army }}
          SEC: ${{ inputs.sec }}
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          case "$COUNT$SEC" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$GROW_ARMY" in
            "" | なし) grow_army="" ;;
            4種 | Lv.1 | ゾンビのみ | "Lv.10 車両" | "Lv.10 射手" | "Lv.9 射手") grow_army="--grow-army=$GROW_ARMY" ;;
            "Lv.9 車両") grow_army="--grow-army=ハーベスター" ;;
            *) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_setup_${GITHUB_RUN_ID}.log"
          echo "LOG=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            node scripts/core/new_dev.mjs $COUNT $DELETE_ACCOUNT ${grow_army:+"$grow_army"} ${SEC:+"--sec=$SEC"} --ci
          ) > "$log" 2>&1 &
          pid=$!
          # 5 分ごとに、ログの最新 30 行を暗号化して 1 行で画面に出す（途中の確かめ用。手元で scripts\core\decrypt_clip.mjs で読む）
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w0
              echo
            fi
          done
          wait "$pid"
          echo "CODE=$?" >> "$GITHUB_ENV"

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set +e
          (
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts())"
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
          ) >> "$LOG" 2>&1
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$LOG" -out "$LOG.enc"
          rm "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit "${CODE:-1}"

      - if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run setup-cancel.yml -R "$GITHUB_REPOSITORY" -f started="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt -q .startedAt)"
