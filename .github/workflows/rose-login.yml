on:
  workflow_dispatch:
    inputs:
      receivers:
        description: 受け手（manual は手動アカウント、sng は SNG の盟主）
        type: choice
        options:
          - manual,sng
          - manual
          - sng
        default: manual,sng
      deadline:
        description: この時刻を過ぎたら新しい送り手を始めない（例 2026-11-05T09:00:00+09:00）
        required: true
      parallel:
        description: 同時に回す件数
        default: "100"
      senders:
        description: 送り手の選び方（unsent は rose が無い行、kind をカンマ区切りで並べると（例 deleted,temp,vip）その kind で今日 JST 9:00 から贈っていない行）
        default: unsent
      sample:
        description: 0 より大きいと、送り手をこの件数に絞って読むだけ（受け取りも贈りもしない）
        default: "0"
      start_at:
        description: 空でなければ、この時刻（例 2026-11-08T06:00:00+09:00）まで待ってから始める。5 時間ごとに次の run へ引き継ぐ
        default: ""

concurrency:
  group: rose-login
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /scripts/ci/wait_until.mjs
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          PARALLEL: ${{ inputs.parallel }}
          SENDERS: ${{ inputs.senders }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          receivers=$(jq -r .inputs.receivers "$GITHUB_EVENT_PATH")
          deadline=$(jq -r .inputs.deadline "$GITHUB_EVENT_PATH")
          start_at=$(jq -r '.inputs.start_at // ""' "$GITHUB_EVENT_PATH")
          case "$receivers" in
            manual,sng | manual | sng) ;;
            *) exit 1 ;;
          esac
          case "$PARALLEL" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          [[ "$deadline" =~ ^[0-9T:+-]+$ ]] || exit 1
          [[ "$start_at" =~ ^[0-9T:+-]*$ ]] || exit 1
          case "$SENDERS" in
            "" | *[!a-z,]*) exit 1 ;;
          esac
          case "$SAMPLE" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          mode=--claim-done
          [ "$SAMPLE" -gt 0 ] && mode="--dry-run --sample=$SAMPLE"
          main() {
            cd src
            if [ -n "$start_at" ]; then
              node scripts/ci/wait_until.mjs "$start_at"
              case $? in
                0) next="" ;;
                10) next="$start_at" ;;
                *) exit 1 ;;
              esac
              gh workflow run rose-login.yml -R "$GITHUB_REPOSITORY" -f receivers="$receivers" -f deadline="$deadline" -f parallel="$PARALLEL" -f senders="$SENDERS" -f sample="$SAMPLE" -f start_at="$next" && echo "次の rose-login.yml を起動した（start_at ${next:-なし}）"
              exit $?
            fi
            node --max-old-space-size=8192 scripts/core/purple_rose.mjs "$receivers" "$SENDERS" $mode --deadline="$deadline" --parallel="$PARALLEL"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の rose-login で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
