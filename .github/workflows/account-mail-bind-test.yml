on:
  workflow_dispatch:
    inputs:
      uid:
        description: 試す gameUid（kind deleted・未加入・備考なし・小隊なしの捨てる件）
        required: true
      replace:
        description: 連携のあとに別のメールアドレスへ付け替える
        type: boolean
        default: false

concurrency:
  group: mail-bind-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/
            /savedata/
            /scripts/ci/mail_bind_test.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          UID: ${{ inputs.uid }}
          REPLACE: ${{ inputs.replace }}
        run: |
          main() {
            cd src
            opt=""
            if [ "$REPLACE" = "true" ]; then
              opt="--replace"
            fi
            node scripts/ci/mail_bind_test.mjs --uid="$UID" $opt
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
