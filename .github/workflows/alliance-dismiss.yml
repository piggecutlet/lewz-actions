on:
  workflow_dispatch:
    inputs:
      name:
        description: 盟主の gameUid
        required: true
      kick_all:
        description: 解散の前にほかのメンバーを全員外す
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/al_dismiss.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          KICK_ALL: ${{ inputs.kick_all && '--kick-all' || '' }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/al_dismiss.mjs "$name" $KICK_ALL
            code=$?
            git add savedata/alliances.json
            if ! git diff --cached --quiet -- savedata/alliances.json; then
              git commit -m "chore: CI で同盟を解散し、alliances.json から消す" -- savedata/alliances.json
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟を解散し、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
