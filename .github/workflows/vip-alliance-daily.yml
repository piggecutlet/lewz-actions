on:
  workflow_dispatch:
    inputs:
      morning:
        description: 時刻に関係なく 9 時の回（解禁・商店・加速・775_001 へ入って派遣・775_002 へ戻す）を流す
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      approver:
        description: 775_002 の加入の承認役（空なら 775 の Empire064d8775。ほかの州は必須）
        required: false
        default: ""
      captain:
        description: vip-alliance-gift-cycle.yml へ渡す小隊長（空なら 775 の Empire064d9775。ほかの州は必須）
        required: false
        default: ""
      alliance:
        description: vip-alliance-gift-cycle.yml へ渡す自分の同盟の ID（空なら 775 の 775_002。ほかの州は必須）
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: vip-alliance-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml
            /scripts/ci/diamond_shield_read.mjs
            /scripts/ci/leave_alliance.mjs

      - timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          APPROVER: ${{ inputs.approver }}
          CAPTAIN: ${{ inputs.captain }}
          ALLIANCE: ${{ inputs.alliance }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$APPROVER$CAPTAIN$ALLIANCE" in
            *[!A-Za-z0-9_]*) exit 1 ;;
          esac
          if [ "$STATE" != 775 ] && { [ -z "$APPROVER" ] || [ -z "$CAPTAIN" ] || [ -z "$ALLIANCE" ]; }; then
            echo "州 $STATE では approver / captain / alliance を入れてください"
            exit 1
          fi
          roles=()
          if [ "$STATE" != 775 ]; then
            roles=(-f state="$STATE" -f approver="$APPROVER" -f captain="$CAPTAIN" -f alliance="$ALLIANCE")
          fi
          morning=$(jq -r '.inputs.morning // "false"' "$GITHUB_EVENT_PATH")
          main() {
            cd src
            restart=""
            for i in $(seq 1 240); do
              busy=$(gh run list -R "$GITHUB_REPOSITORY" -w vip-alliance-gift-cycle.yml -L 5 --json status -q '[.[] | select(.status != "completed")] | length')
              if [ "$busy" = "0" ]; then break; fi
              if [ "$i" = 1 ]; then echo "vip-alliance-gift-cycle.yml の周が終わるまで待つ"; fi
              restart=1
              sleep 10
            done
            names=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>(a.home||a.kind===KIND.VMS)&&(a.note||'').includes('VIP')).map((a)=>a.name).join(','))})" "$STATE")
            node scripts/core/shield.mjs "$names" || true
            node scripts/core/vip_unlock.mjs "$names" || true
            if [ "$morning" = "true" ] || [ "$(TZ=JST-9 date +%H)" -lt 12 ]; then
              node scripts/core/vip_store.mjs "$names" || true
              node scripts/core/use_skill.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
              node scripts/core/vip_boost.mjs "$names" --train-zombie || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
                for id in $(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts})=>{console.log([...new Set((readAccounts()[process.argv[1]]||[]).map((a)=>a.home).filter(Boolean))].sort().join(' '))})" "$STATE"); do
                  unlocked=$(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts})=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.home===process.argv[2]&&(a.note||'').includes('VIP')&&a.vipStore===1).map((a)=>a.name).join(','))})" "$STATE" "$id")
                  approver=$(node -e "import('node:fs').then(({readFileSync})=>{const d=JSON.parse(readFileSync('savedata/alliances.json','utf8'));console.log(((d[process.argv[1]]||[]).find((a)=>a.id===process.argv[2])||{}).approver||'')})" "$STATE" "$id")
                  zombie_opt=""
                  if [ "$(node -e "import('node:fs').then(({readFileSync})=>{const d=JSON.parse(readFileSync('savedata/alliances.json','utf8'));console.log(((d[process.argv[1]]||[]).find((a)=>a.id===process.argv[2])||{}).nearManual===true)})" "$STATE" "$id")" = true ]; then
                    zombie_opt="--only-send-lv10-zombie"
                  fi
                  if [ -n "$unlocked" ]; then
                    unlocked=$(node scripts/core/vip_send.mjs "$unlocked" $zombie_opt --check | tee -a /dev/stderr | sed -n 's/^送れる //p')
                  fi
                  echo "$id の解禁済みの VIP を 775_001 へ入れて贈る（承認役 $approver）"
                  for part in "$(echo "$unlocked" | cut -d, -f1-56)" "$(echo "$unlocked" | cut -d, -f57- -s)"; do
                    if [ -z "$part" ] || [ -z "$approver" ]; then continue; fi
                    node scripts/ci/leave_alliance.mjs "$part" || true
                    node scripts/core/join_alliance.mjs "$part" || true
                    node scripts/core/vip_send.mjs "$part" $zombie_opt || true
                    node scripts/ci/leave_alliance.mjs "$part" || true
                    node scripts/core/join_alliance.mjs "$part" --leader="$approver" || true
                  done
                  node scripts/core/vip_alliance_rank.mjs --state="$STATE" --alliance="$id" || true
                done
              restart=1
            else
              node scripts/core/train_army.mjs "$names" --zombie-only || true
            fi
            node scripts/ci/diamond_shield_read.mjs "$names" --state="$STATE" || true
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-tms でダイヤを読み、accounts.json を更新する'))"
            if [ -n "$restart" ]; then
              echo "vip-alliance-gift-cycle.yml を起動する"
              gh workflow run vip-alliance-gift-cycle.yml -R "$GITHUB_REPOSITORY" "${roles[@]}" || true
              if [ "$STATE" = 775 ]; then
                for id in $(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts})=>{console.log([...new Set((readAccounts()[process.argv[1]]||[]).map((a)=>a.home).filter(Boolean))].sort().slice(1).join(' '))})" "$STATE"); do
                  gh workflow run vip-alliance-gift-cycle.yml -R "$GITHUB_REPOSITORY" -f alliance="$id" || true
                done
              fi
            fi
          }
          . .github/scripts/logged.sh
          run_logged main
