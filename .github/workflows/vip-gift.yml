on:
  workflow_dispatch:
    inputs:
      name:
        description: 相手の表示名
        required: true
      xy:
        description: 相手の座標（x,y。1 マスずれていてよい）
        required: true
      arm:
        description: 兵種 ID
        default: "107309"
      accounts:
        description: 送るアカウントの数
        default: "20"

permissions:
  contents: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - timeout-minutes: 60
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r '.inputs.name // ""' "$GITHUB_EVENT_PATH")
          xy=$(jq -r '.inputs.xy // ""' "$GITHUB_EVENT_PATH")
          arm=$(jq -r '.inputs.arm // "107309"' "$GITHUB_EVENT_PATH")
          accounts=$(jq -r '.inputs.accounts // "20"' "$GITHUB_EVENT_PATH")
          if [ -z "$name" ]; then
            exit 1
          fi
          case "$arm$accounts" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          case "$xy" in
            *[!0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/vip_gift.mjs "$name" "$xy" "--arm=$arm" "--accounts=$accounts"
          }
          . .github/scripts/logged.sh
          run_logged main
