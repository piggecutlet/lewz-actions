on:
  workflow_dispatch:
    inputs:
      name:
        description: 相手の表示名
        required: true
      xy:
        description: 相手の座標（x,y。1 マスずれていてよい）
        required: true
      arm:
        description: 兵種 ID
        default: "107309"
      accounts:
        description: 送るアカウントの数
        default: "20"

permissions:
  contents: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - timeout-minutes: 60
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r '.inputs.name // ""' "$GITHUB_EVENT_PATH")
          xy=$(jq -r '.inputs.xy // ""' "$GITHUB_EVENT_PATH")
          arm=$(jq -r '.inputs.arm // "107309"' "$GITHUB_EVENT_PATH")
          accounts=$(jq -r '.inputs.accounts // "20"' "$GITHUB_EVENT_PATH")
          if [ -z "$name" ]; then
            exit 1
          fi
          case "$arm$accounts" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          case "$xy" in
            *[!0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_vip-gift_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            node scripts/core/vip_gift.mjs "$name" "$xy" "--arm=$arm" "--accounts=$accounts"
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
