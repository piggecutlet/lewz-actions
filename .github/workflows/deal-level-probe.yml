on:
  workflow_dispatch:
    inputs:
      from:
        description: 送る側の gameUid
        required: true
      to:
        description: 受ける側の gameUid
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            scripts/ci
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          from=$(jq -r .inputs.from "$GITHUB_EVENT_PATH")
          to=$(jq -r .inputs.to "$GITHUB_EVENT_PATH")
          case "$from$to" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/deal_level_probe.mjs "$from" "$to"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
