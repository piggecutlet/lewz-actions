on:
  workflow_dispatch:
    inputs:
      uid:
        description: 接続先を聞く uid（カンマ区切り。ログインはしない）
        required: true
      state:
        description: 州（国際チャット country_<州> を読む）
        required: true

permissions:
  contents: write

concurrency:
  group: country-chat-probe

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/_miniws.mjs
            /scripts/ci/country_chat_probe.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          uid=$(jq -r .inputs.uid "$GITHUB_EVENT_PATH")
          state=$(jq -r .inputs.state "$GITHUB_EVENT_PATH")
          case "$uid" in "" | *[!0-9,]*) exit 1 ;; esac
          case "$state" in "" | *[!0-9]*) exit 1 ;; esac
          main() {
            cd src && node scripts/ci/country_chat_probe.mjs "$state" "$uid"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
