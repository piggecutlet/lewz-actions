on:
  workflow_dispatch:
    inputs:
      account:
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/gather.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          account=$(jq -r .inputs.account "$GITHUB_EVENT_PATH")
          case "$account" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/gather.mjs "$account"
          }
          . .github/scripts/logged.sh
          run_logged main
