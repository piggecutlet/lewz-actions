on:
  workflow_dispatch:
    inputs:
      login:
        required: true

permissions:
  contents: write

concurrency:
  group: world-power-fill

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/world_power_fill.mjs
            /scripts/ci/world_players_merge.mjs
            /scripts/scratch/country_members_last_online.json
            /scripts/scratch/world_owners_*.json
            /scripts/scratch/world_alliance_check_*.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          LOGIN: ${{ inputs.login }}
        run: |
          case "$LOGIN" in
            *[!0-9,]*) exit 1 ;;
          esac
          main() {
            cd src && node scripts/ci/world_power_fill.mjs --login=$LOGIN
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
