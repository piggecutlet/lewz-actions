on:
  workflow_dispatch:
    inputs:
      defender:
        required: true
      attackers:
        description: 表示名,表示名,...
        required: true
      target:
        description: x,y
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/resource_war.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          defender=$(jq -r .inputs.defender "$GITHUB_EVENT_PATH")
          attackers=$(jq -r .inputs.attackers "$GITHUB_EVENT_PATH")
          target=$(jq -r .inputs.target "$GITHUB_EVENT_PATH")
          case "$defender" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          [[ "$attackers" =~ ^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$ ]] || exit 1
          [[ "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          main() {
            cd src && node scripts/ci/resource_war.mjs "$defender" "$attackers" "$target"
          }
          . .github/scripts/logged.sh
          run_logged main
