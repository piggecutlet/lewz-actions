on:
  workflow_dispatch:
    inputs:
      names:
        description: gameUid（カンマ区切り）
        required: true
      leader:
        description: 盟主の gameUid（空なら州の自分の同盟）
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!0-9,]*) exit 1 ;;
          esac
          leader=$(jq -r '.inputs.leader // ""' "$GITHUB_EVENT_PATH")
          case "$leader" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/join_alliance.mjs "$names" ${leader:+"--leader=$leader"}
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟へ加入させ、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
