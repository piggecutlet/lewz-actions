on:
  workflow_dispatch:
    inputs:
      count:
        required: false
        default: ""
      delete_account:
        description: 1 回目の削除申請（この run で作った件）
        type: boolean
        default: true
      second_delete:
        description: 2 回目の削除申請（7 日たった件）
        type: boolean
        default: true
      grow_army:
        description: grow-army
        type: choice
        default: 既定
        options:
          - 既定
          - なし
          - 4種
          - Lv.1
          - ゾンビのみ
          - Lv.9 車両
          - Lv.10 車両
          - Lv.10 射手
          - Lv.9 射手
          - DF
          - core
          - VIP
          - VIP_NEW_ALLIANCE
      target:
        description: DF の移転先と偵察先 x,y（空なら scripts/ci/ci_defaults.mjs の DF_TARGET、なしなら後回し）
        required: false
        default: ""
      sec:
        required: false
        default: ""
      seats:
        description: 使う枠の持ち主の表示名,...（空なら accounts.json の小隊用アカウント）
        required: false
        default: ""
      skip_build_base:
        description: build-base を飛ばす
        type: boolean
        default: false
      officer:
        description: 教官をランク 5
        type: boolean
        default: false
      force:
        description: 小隊の結晶の確かめを飛ばす
        type: boolean
        default: false
      dry_run:
        description: 1 周目に脱退させる件・作る件数・使う枠を出すだけ（何もしない）
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      vip_center:
        description: VIP を移す中心 x,y（空なら 775 の 1071,793。ほかの州の VIP は必須）
        required: false
        default: ""

concurrency:
  group: setup
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/ci_defaults.mjs
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.system.xml

      - env:
          COUNT: ${{ inputs.count }}
          DELETE_ACCOUNT: ${{ inputs.delete_account && '--delete-account' || '' }}
          SECOND_DELETE: ${{ inputs.second_delete && '--second-delete' || '' }}
          GROW_ARMY: ${{ inputs.grow_army }}
          SEC: ${{ inputs.sec }}
          TARGET: ${{ inputs.target }}
          SEATS: ${{ inputs.seats }}
          SKIP_BUILD_BASE: ${{ inputs.skip_build_base && '--skip-build-base' || '' }}
          OFFICER: ${{ inputs.officer && '--officer' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          VIP_CENTER: ${{ inputs.vip_center }}
        run: |
          case "$COUNT$SEC" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          [[ -z "$VIP_CENTER" || "$VIP_CENTER" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          case "$SEATS" in
            *[!A-Za-z0-9,:]*) exit 1 ;;
          esac
          [[ -z "$TARGET" || "$TARGET" = なし || "$TARGET" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          GROW_ARMY_DEFAULT=""
          [ "$GROW_ARMY" = 既定 ] && GROW_ARMY=$(cd src && node --input-type=module -e 'import { GROW_ARMY } from "./scripts/ci/ci_defaults.mjs"; console.log(GROW_ARMY);') && GROW_ARMY_DEFAULT="--grow-army-default"
          case "$GROW_ARMY" in
            "" | なし) grow_army="" ;;
            4種 | Lv.1 | ゾンビのみ | "Lv.10 車両" | "Lv.10 射手" | "Lv.9 射手") grow_army="--grow-army=$GROW_ARMY" ;;
            "Lv.9 車両") grow_army="--grow-army=ハーベスター" ;;
            DF) grow_army="--grow-army=DF" ;;
            core) grow_army="--grow-army=core" ;;
            VIP) grow_army=""; OFFICER="--officer"; FIRE="--fire-initial" ;;
            VIP_NEW_ALLIANCE) grow_army=""; OFFICER="--officer"; FIRE="--fire-initial --no-teleport" ;;
            *) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/new_dev.mjs $COUNT $DELETE_ACCOUNT $SECOND_DELETE ${grow_army:+"$grow_army"} $GROW_ARMY_DEFAULT ${TARGET:+"--target=$TARGET"} ${SEC:+"--sec=$SEC"} ${SEATS:+"--seats=$SEATS"} $SKIP_BUILD_BASE $OFFICER $FIRE $FORCE $DRY_RUN --ci --state="$STATE" ${VIP_CENTER:+"--vip-center=$VIP_CENTER"}
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          set +e
          (
            cd src
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts())"
            if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
              curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
            fi
          ) >> "$LOG" 2>&1
          if [ "$JOB_STATUS" = cancelled ]; then
            if gh workflow run account-setup-cancel.yml -R "$GITHUB_REPOSITORY" -f started="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt -q .startedAt)" -f state="$STATE" -f run="$GITHUB_RUN_ID" >> "$LOG" 2>&1; then
              echo "account-setup-cancel.yml を起動した" >> "$LOG"
            else
              echo "account-setup-cancel.yml を起動できなかった。この run で作った件が同盟に残っていないか確かめる" >> "$LOG"
            fi
          fi
          set -e
          . .github/scripts/logged.sh
          finish_logged

      - if: cancelled() && env.LOG == ''
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          STATE: ${{ inputs.state || '775' }}
        run: gh workflow run account-setup-cancel.yml -R "$GITHUB_REPOSITORY" -f started="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json startedAt -q .startedAt)" -f state="$STATE"
