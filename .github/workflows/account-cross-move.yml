on:
  workflow_dispatch:
    inputs:
      gameUid:
        required: true
      state:
        required: true
        default: "774"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/cross_move.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          uid=$(jq -r .inputs.gameUid "$GITHUB_EVENT_PATH")
          state=$(jq -r .inputs.state "$GITHUB_EVENT_PATH")
          [[ "$uid" =~ ^[0-9]+$ ]] || exit 1
          [[ "$state" =~ ^[0-9]+$ ]] || exit 1
          main() {
            cd src && node scripts/ci/cross_move.mjs "$uid" "$state"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
