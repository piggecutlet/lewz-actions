on:
  workflow_dispatch:
    inputs:
      state:
        description: 新規作成の割り当て先になるのを待つ州
        required: true
      dry_run:
        description: 同じ uuid で 1 分おきに 3 回だけ送り、応答を出して終わる
        type: boolean
        default: false

concurrency:
  group: new-state-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/
            /savedata/
            /scripts/ci/new_state_watch.mjs

      - env:
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          case "$STATE" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          opts=""
          [ "$DRY_RUN" = true ] && opts="--dry-run"
          main() {
            [ "$DRY_RUN" = true ] || gh workflow run tool-rerun-next.yml -R "$GITHUB_REPOSITORY" -f run="$GITHUB_RUN_ID" -f workflow=new-state-watch.yml
            cd src
            node scripts/ci/new_state_watch.mjs --state="$STATE" $opts
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
