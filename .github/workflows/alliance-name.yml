on:
  workflow_dispatch:
    inputs:
      id:
        description: 自分の同盟の ID（775_001 など）。savedata/alliances.json に無ければ作る
        required: true
      name:
        description: 同盟の名前（英数字と空白で 3〜20 文字）。略称は先頭 3 文字
        required: true
      creator:
        description: 作るときの gameUid（同盟に入っていないもの）。名前を変えるときは空
        required: false
      abbr:
        description: 略称（英数字 3 文字）。空なら名前の先頭 3 文字
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          id=$(jq -r .inputs.id "$GITHUB_EVENT_PATH")
          case "$id" in
            "" | *[!0-9_]*) exit 1 ;;
          esac
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9\ ]*) exit 1 ;;
          esac
          creator=$(jq -r ".inputs.creator // \"\"" "$GITHUB_EVENT_PATH")
          case "$creator" in
            *[!0-9]*) exit 1 ;;
          esac
          abbr=$(jq -r ".inputs.abbr // \"\"" "$GITHUB_EVENT_PATH")
          case "$abbr" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/alliance_name.mjs "$id" "$name" ${creator:+"$creator"} ${abbr:+"--abbr=$abbr"}
            code=$?
            git add savedata/alliances.json
            if ! git diff --cached --quiet -- savedata/alliances.json; then
              git commit -m "chore: CI で同盟 $id の名前を $name にする" -- savedata/alliances.json
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI で同盟の名前を変え、accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
