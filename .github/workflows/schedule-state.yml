on:
  workflow_dispatch:
    inputs:
      state:
        description: 州
        default: "775"

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            set -e
            gh workflow run vip-daily.yml -R "$GITHUB_REPOSITORY" -f state="$STATE" || true
            gh workflow run vip-alliance-daily.yml -R "$GITHUB_REPOSITORY" -f state="$STATE" || true
            gh workflow run schedule-manual-daily.yml -R "$GITHUB_REPOSITORY" -f state="$STATE"
            if [ "$(TZ=Asia/Tokyo date +%H)" = 09 ]; then
              gh workflow run team-zombie.yml -R "$GITHUB_REPOSITORY" -f state="$STATE"
            fi
          }
          . .github/scripts/logged.sh
          run_logged main
