on:
  workflow_dispatch:
    inputs:
      state:
        description: 州
        default: "775"

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/
            /savedata/

      - env:
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            set -e
            gh workflow run schedule-manual-daily.yml -R "$GITHUB_REPOSITORY" -f state="$STATE"
            if [ "$(TZ=Asia/Tokyo date +%H)" = 09 ]; then
              gh workflow run team-zombie.yml -R "$GITHUB_REPOSITORY" -f state="$STATE"
              read -r to alliance <<< "$(cd src && node -e "import('./scripts/core/_state.mjs').then(({stateOf})=>{const s=stateOf(process.argv[1]);console.log(s.manual[0],s.id)})" "$STATE")"
              if [ -z "$to" ] || [ -z "$alliance" ]; then exit 1; fi
              before=$(TZ=Asia/Tokyo date -d "tomorrow 00:00" +%FT%H:%M+09:00)
              for arm in "Lv.10 ゾンビ" "Lv.10 車両"; do
                until [ "$(gh run list -R "$GITHUB_REPOSITORY" -w account-gift-soldier.yml -L 20 --json status -q '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')" = 0 ]; do
                  sleep 30
                done
                gh workflow run account-gift-soldier.yml -R "$GITHUB_REPOSITORY" -f alliance="$alliance" -f to="$to" -f arm="$arm" -f amount=1000000000 -f shield_before="$before" -f state="$STATE"
                sleep 15
              done
            fi
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
