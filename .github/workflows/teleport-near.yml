on:
  workflow_dispatch:
    inputs:
      target:
        description: 移転先の座標（x,y）
        required: true
      names:
        required: true
      diamond:
        description: 高級移転が無ければダイヤ
        type: boolean
        default: false
      dry_run:
        description: 候補を近い順に 5 件出すだけ（移転しない）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /obb/assets/WorldMap.tmx

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DIAMOND: ${{ inputs.diamond }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          target=$(jq -r .inputs.target "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          opt=""
          if [ "$DIAMOND" = "true" ]; then
            opt="--diamond"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            opt="$opt --dry-run"
          fi
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_teleport-near_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node scripts/core/teleport_near.mjs "$target" "$names" $opt
            code=$?
            if [ "$DRY_RUN" = "true" ]; then
              exit $code
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の teleport-near で accounts.json を更新する'))"
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
