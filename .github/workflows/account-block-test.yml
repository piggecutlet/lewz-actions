on:
  workflow_dispatch:
    inputs:
      a:
        description: ブロックする側の gameUid
        required: true
      b:
        description: DM を送る側の gameUid
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout: |
            api
            scripts/core
            scripts/ci
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          a=$(jq -r .inputs.a "$GITHUB_EVENT_PATH")
          b=$(jq -r .inputs.b "$GITHUB_EVENT_PATH")
          for n in "$a" "$b"; do
            case "$n" in
              "" | *[!0-9]*) exit 1 ;;
            esac
          done
          main() {
            cd src
            node scripts/ci/block_test.mjs "$a" "$b"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
