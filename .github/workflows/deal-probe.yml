on:
  workflow_dispatch:
    inputs:
      from:
        default: Empire055bd775
      to:
        default: Empire055be775
      pwd:
        default: ""
      goods:
        default: ""
      allowed:
        description: 使ってよい 2 件の表示名をカンマ区切り（空なら 775 の Empire055bd775,Empire055be775。ほかの州は必須）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/core/deal_probe.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          from=$(jq -r .inputs.from "$GITHUB_EVENT_PATH")
          to=$(jq -r .inputs.to "$GITHUB_EVENT_PATH")
          case "$from$to" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          pwd=$(jq -r '.inputs.pwd // ""' "$GITHUB_EVENT_PATH")
          case "$pwd" in
            "" | [0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) exit 1 ;;
          esac
          goods=$(jq -r '.inputs.goods // ""' "$GITHUB_EVENT_PATH")
          case "$goods" in
            *[!a-z0-9:,]*) exit 1 ;;
          esac
          allowed=$(jq -r '.inputs.allowed // ""' "$GITHUB_EVENT_PATH")
          case "$allowed" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M)_deal-probe_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            node scripts/core/deal_probe.mjs "$from" "$to" "$pwd" "$goods" ${allowed:+"--allowed=$allowed"}
            exit $?
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
