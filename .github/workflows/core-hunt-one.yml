on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      size:
        description: 1 部隊の体数の上限（--size。空なら待機兵を均等に割る）
        default: ""
      high:
        description: 狙える一番高い Lv から倒す（--high）
        type: boolean
        default: false

concurrency:
  group: core-hunt-one-${{ inputs.name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout: |
            api
            scripts/core
            savedata

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          mkdir -p logs
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          size=$(jq -r '.inputs.size // ""' "$GITHUB_EVENT_PATH")
          case "$size" in
            *[!0-9]*) exit 1 ;;
          esac
          opts=""
          [ -n "$size" ] && opts="$opts --size=$size"
          [ "$(jq -r '.inputs.high // false' "$GITHUB_EVENT_PATH")" = "true" ] && opts="$opts --high"
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_core-hunt-one_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          echo "log=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            node scripts/core/core_hunt.mjs "$name" $opts
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$log" ] && [ -f "$log" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done

  next:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length')
          if [ "$n" -gt 0 ]; then
            size=$(jq -r '.inputs.size // ""' "$GITHUB_EVENT_PATH")
            high=$(jq -r '.inputs.high // false' "$GITHUB_EVENT_PATH")
            gh workflow run core-hunt-one.yml -R "$GITHUB_REPOSITORY" -f name="$name" -f size="$size" -f high="$high"
            echo "続きを起動した"
          fi
