on:
  workflow_dispatch:
    inputs:
      name:
        required: true
      size:
        description: 1 部隊の体数の上限（--size。空なら待機兵を均等に割る）
        default: ""
      high:
        description: 狙える一番高い Lv から倒す（--high）
        type: boolean
        default: false

concurrency:
  group: core-hunt-one-${{ inputs.name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          size=$(jq -r '.inputs.size // ""' "$GITHUB_EVENT_PATH")
          case "$size" in
            *[!0-9]*) exit 1 ;;
          esac
          opts=""
          [ -n "$size" ] && opts="$opts --size=$size"
          [ "$(jq -r '.inputs.high // false' "$GITHUB_EVENT_PATH")" = "true" ] && opts="$opts --high"
          main() {
            cd src
            node scripts/core/core_hunt.mjs "$name" $opts
          }
          . .github/scripts/logged.sh
          start_logged main
          code=$CODE
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] || exit 0
          . .github/scripts/logged.sh
          CODE=0
          finish_logged

  next:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          n=""
          for i in 1 2 3 4 5; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length') && break
            n=""
            echo "run の結果を読めなかったので 30 秒後にやり直す（$i 回目）"
            sleep 30
          done
          if [ -z "$n" ]; then
            echo "run の結果を 5 回とも読めなかった"
            exit 1
          fi
          if [ "$n" -gt 0 ]; then
            size=$(jq -r '.inputs.size // ""' "$GITHUB_EVENT_PATH")
            high=$(jq -r '.inputs.high // false' "$GITHUB_EVENT_PATH")
            for i in 1 2 3 4 5; do
              if gh workflow run core-hunt-one.yml -R "$GITHUB_REPOSITORY" -f name="$name" -f size="$size" -f high="$high"; then
                echo "続きを起動した"
                exit 0
              fi
              echo "続きを起動できなかったので 30 秒後にやり直す（$i 回目）"
              sleep 30
            done
            echo "続きを 5 回とも起動できなかった"
            exit 1
          fi
