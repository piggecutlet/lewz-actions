on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      kinds:
        description: 食料 / 燃料 / 鉄鋼 / 合金 をカンマ区切り（空なら 4 種）。「食料:100000」で届けたい量（税 10% を上乗せして送る）
        required: false
        default: ""
      to:
        description: 送り先の表示名（空なら 775 は Empire061775、ほかの州は必須。Empire061775 以外なら同盟 775_001 への加入をしない）
        required: false
        default: ""
      teleport:
        description: 送り先の付近へ移転する表示名をカンマ区切り（空なら移転しない）
        required: false
        default: ""
      dry_run:
        description: 加入しない。移転の候補と手持ち・補給の残り・ダイヤを出すだけ
        type: boolean
        default: false
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/obb/assets/WorldMap.tmx
            /scripts/ci/resource_support.mjs
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          kinds=$(jq -r '.inputs.kinds // ""' "$GITHUB_EVENT_PATH")
          kind="(食料|燃料|石油|鉄鋼|合金)(:[0-9]+)?"
          [[ -z "$kinds" || "$kinds" =~ ^$kind(,$kind)*$ ]] || exit 1
          teleport=$(jq -r '.inputs.teleport // ""' "$GITHUB_EVENT_PATH")
          case "$teleport" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          to=$(jq -r '.inputs.to // ""' "$GITHUB_EVENT_PATH")
          if [ -z "$to" ] && [ "$STATE" = 775 ]; then
            to=Empire061775
          fi
          case "$to" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ "$DRY_RUN" = "true" ]; then
              if [ -n "$teleport" ]; then
                center=$(node scripts/ci/resource_support.mjs "$names" --state="$STATE" --to="$to" --where | tail -n 1)
                [[ "$center" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
                node scripts/core/teleport_near.mjs "$center" "$teleport" --dry-run
              fi
              node scripts/ci/resource_support.mjs "$names" --state="$STATE" $kinds --to="$to" --buy --dry
              exit $?
            fi
            if [ "$STATE" = 775 ] && [ "$to" = "Empire061775" ]; then
              node scripts/core/join_alliance.mjs "$names"
            fi
            code=0
            if [ -n "$teleport" ]; then
              center=$(node scripts/ci/resource_support.mjs "$names" --state="$STATE" --to="$to" --where | tail -n 1)
              [[ "$center" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
              node scripts/core/teleport_near.mjs "$center" "$teleport" || code=1
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の resource-support で accounts.json を更新する'))"
            [ $code -eq 0 ] || exit 1
            node scripts/ci/resource_support.mjs "$names" --state="$STATE" $kinds --to="$to" --buy
          }
          . .github/scripts/logged.sh
          run_logged main
