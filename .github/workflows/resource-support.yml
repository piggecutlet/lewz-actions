on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      kinds:
        description: 食料 / 燃料 / 鉄鋼 / 合金 をカンマ区切り（空なら 4 種）。「食料:100000」で届けたい量（税 10% を上乗せして送る）
        required: false
        default: ""
      to:
        description: 送り先の表示名（Empire061775 以外なら同盟 CMP への加入をしない）
        required: false
        default: Empire061775
      teleport:
        description: 送り先の付近へ移転する表示名をカンマ区切り（空なら移転しない）
        required: false
        default: ""
      dry_run:
        description: 加入しない。移転の候補と手持ち・補給の残り・ダイヤを出すだけ
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /obb/assets/WorldMap.tmx
            /work/send_res_even775.mjs
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.activity.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          kinds=$(jq -r '.inputs.kinds // ""' "$GITHUB_EVENT_PATH")
          kind="(食料|燃料|石油|鉄鋼|合金)(:[0-9]+)?"
          [[ -z "$kinds" || "$kinds" =~ ^$kind(,$kind)*$ ]] || exit 1
          teleport=$(jq -r '.inputs.teleport // ""' "$GITHUB_EVENT_PATH")
          case "$teleport" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          to=$(jq -r '.inputs.to // "Empire061775"' "$GITHUB_EVENT_PATH")
          case "$to" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_resource-support_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            if [ "$DRY_RUN" = "true" ]; then
              if [ -n "$teleport" ]; then
                center=$(node work/send_res_even775.mjs "$names" --to="$to" --where | tail -n 1)
                [[ "$center" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
                node scripts/core/teleport_near.mjs "$center" "$teleport" --dry-run
              fi
              node work/send_res_even775.mjs "$names" $kinds --to="$to" --buy --dry
              exit $?
            fi
            if [ "$to" = "Empire061775" ]; then
              node scripts/core/join_alliance.mjs "$names"
            fi
            code=0
            if [ -n "$teleport" ]; then
              center=$(node work/send_res_even775.mjs "$names" --to="$to" --where | tail -n 1)
              [[ "$center" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
              node scripts/core/teleport_near.mjs "$center" "$teleport" || code=1
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の resource-support で accounts.json を更新する'))"
            [ $code -eq 0 ] || exit 1
            node work/send_res_even775.mjs "$names" $kinds --to="$to" --buy
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
