on:
  workflow_dispatch:
    inputs:
      name:
        description: 相手の表示名
        required: true
      only_send_lv10_zombie:
        description: Lv.10 ゾンビ ネメシスを贈る
        type: boolean
        default: false
      only_send_lv10_archer:
        description: Lv.10 射手 シャドウアサシンを贈る
        type: boolean
        default: false
      only_send_lv10_vehicle:
        description: Lv.10 車両 ピースメーカーを贈る
        type: boolean
        default: false
      only_send_lv10_warrior:
        description: Lv.10 戦士 Zヒーローを贈る
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml
            /scripts/ci/leave_alliance.mjs

      - timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r '.inputs.name // ""' "$GITHUB_EVENT_PATH")
          if [ -z "$name" ]; then
            exit 1
          fi
          opts=""
          for arm in zombie archer vehicle warrior; do
            if [ "$(jq -r ".inputs.only_send_lv10_$arm // \"false\"" "$GITHUB_EVENT_PATH")" = "true" ]; then
              opts="$opts --only-send-lv10-$arm"
            fi
          done
          main() {
            hour=$(TZ=JST-9 date +%H)
            if [ "$hour" = 08 ] || [ "$hour" = 20 ]; then
              echo "JST $hour 時台は毎日の処理の前なので送らない。毎日の処理が終わってから実行してください"
              exit 1
            fi
            for w in vip-daily.yml vip-alliance-daily.yml schedule-manual-daily.yml; do
              busy=$(gh run list -R "$GITHUB_REPOSITORY" -w "$w" -L 5 --json status -q '[.[] | select(.status != "completed")] | length')
              if [ "$busy" != "0" ]; then
                echo "$w が動いているので送らない。終わってから実行してください"
                exit 1
              fi
            done
            cd src
            node scripts/core/vip_gift_10m.mjs "$name" $opts
            code=$?
            git add savedata/alliances.json
            if ! git diff --cached --quiet -- savedata/alliances.json; then
              git commit -m "chore: CI の vip-gift-10m で同盟の startAfter を 4 時間後にする" -- savedata/alliances.json
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-gift-10m で accounts.json を更新する'))"
            for id in $(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts,DEFAULT_STATE})=>{console.log([...new Set((readAccounts()[DEFAULT_STATE]||[]).map((a)=>a.home).filter(Boolean))].sort().join(' '))})"); do
              echo "$id の vip-alliance-gift-cycle.yml を起動する"
              gh workflow run vip-alliance-gift-cycle.yml -R "$GITHUB_REPOSITORY" -f alliance="$id" || true
            done
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
