on:
  workflow_dispatch:
    inputs:
      login:
        required: true
      parallel:
        default: "1"
      states:
        default: ""

permissions:
  contents: write

concurrency:
  group: world-scan-all

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/world_scan_all.mjs
            /scripts/ci/world_owners_probe.mjs
            /scripts/ci/world_alliance_check.mjs
            /scripts/ci/world_players_merge.mjs
            /scripts/scratch/country_members_last_online.json
            /scripts/scratch/world_owners_*.json
            /scripts/scratch/world_alliance_check_*.json

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          LOGIN: ${{ inputs.login }}
          STATES: ${{ inputs.states }}
          PARALLEL: ${{ inputs.parallel || '1' }}
        run: |
          case "$LOGIN$STATES$PARALLEL" in
            *[!0-9,]*) exit 1 ;;
          esac
          flags="--login=$LOGIN --parallel=$PARALLEL"
          if [ -n "$STATES" ]; then
            flags="$flags --states=$STATES"
          fi
          main() {
            cd src && node scripts/ci/world_scan_all.mjs $flags
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
