on:
  workflow_dispatch:
    inputs:
      morning:
        description: 時刻に関係なく 9 時の回（解禁・商店・加速・CMP へ入って派遣・TMS へ戻す）を流す
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      approver:
        description: TMS の加入の承認役（空なら 775 の Empire064d8775。ほかの州は必須）
        required: false
        default: ""
      captain:
        description: tms.yml へ渡す小隊長（空なら 775 の Empire064d9775。ほかの州は必須）
        required: false
        default: ""
      abbr:
        description: tms.yml へ渡す同盟の略称（空なら 775 の TMS。ほかの州は必須）
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: vip-tms
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.activity.xml
            /work/gold_shield775.mjs
            /work/leave_alliance.mjs
            /.SKIP_DONATION_TMS

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          APPROVER: ${{ inputs.approver }}
          CAPTAIN: ${{ inputs.captain }}
          ABBR: ${{ inputs.abbr }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$APPROVER$CAPTAIN$ABBR" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          if [ "$STATE" != 775 ] && { [ -z "$APPROVER" ] || [ -z "$CAPTAIN" ] || [ -z "$ABBR" ]; }; then
            echo "州 $STATE では approver / captain / abbr を入れてください"
            exit 1
          fi
          roles=()
          if [ "$STATE" != 775 ]; then
            roles=(-f state="$STATE" -f approver="$APPROVER" -f captain="$CAPTAIN" -f abbr="$ABBR")
          fi
          morning=$(jq -r '.inputs.morning // "false"' "$GITHUB_EVENT_PATH")
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_vip-tms_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            restart=""
            for i in $(seq 1 240); do
              busy=$(gh run list -R "$GITHUB_REPOSITORY" -w tms.yml -L 5 --json status -q '[.[] | select(.status != "completed")] | length')
              if [ "$busy" = "0" ]; then break; fi
              if [ "$i" = 1 ]; then echo "tms.yml の周が終わるまで待つ"; fi
              restart=1
              sleep 10
            done
            names=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.kind===KIND.VMS&&['VIP','小隊長','小隊'].includes(a.note)).map((a)=>a.name).join(','))})" "$STATE")
            node scripts/core/shield.mjs "$names" || true
            if [ "$morning" = "true" ] || [ "$(TZ=JST-9 date +%H)" -lt 12 ]; then
              node scripts/core/vip_unlock.mjs "$names" || true
              node scripts/core/vip_store.mjs "$names" || true
              node scripts/core/use_skill.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
              node scripts/core/vip_boost.mjs "$names" --train-zombie || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
              if [ "$(tr -d '\r\n ' < .SKIP_DONATION_TMS 2>/dev/null)" = "1" ]; then
                echo ".SKIP_DONATION_TMS が 1 なので CMP へ入って贈るのを飛ばす"
              else
                for part in "$(echo "$names" | cut -d, -f1-56)" "$(echo "$names" | cut -d, -f57- -s)"; do
                  if [ -z "$part" ]; then continue; fi
                  node work/leave_alliance.mjs "$part" || true
                  node scripts/core/join_alliance.mjs "$part" || true
                  node scripts/core/vip_send.mjs "$part" || true
                  node work/leave_alliance.mjs "$part" || true
                  node scripts/core/join_alliance.mjs "$part" --leader="${APPROVER:-Empire064d8775}" || true
                done
                node scripts/core/tms_rank.mjs --state="$STATE" ${APPROVER:+"--approver=$APPROVER"} || true
              fi
              restart=1
            else
              node scripts/core/train_army.mjs "$names" --zombie-only || true
            fi
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node work/gold_shield775.mjs "$names" --state="$STATE" || true
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-tms でダイヤを読み、accounts.json を更新する'))"
            if [ -n "$restart" ]; then
              echo "tms.yml を起動する"
              gh workflow run tms.yml -R "$GITHUB_REPOSITORY" "${roles[@]}" || true
            fi
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
