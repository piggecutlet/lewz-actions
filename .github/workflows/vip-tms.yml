on:
  workflow_dispatch:
    inputs:
      morning:
        description: 時刻に関係なく 9 時の回（解禁・商店・加速・CMP へ入って派遣・TMS へ戻す）を流す
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: vip-tms
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /device/files/ja/ja_ilocalize_base.json
            /device/files/WarZDoc/config/database.activity.xml
            /work/gold_shield775.mjs
            /work/leave_alliance.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          morning=$(jq -r '.inputs.morning // "false"' "$GITHUB_EVENT_PATH")
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_vip-tms_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            restart=""
            for i in $(seq 1 240); do
              busy=$(gh run list -R "$GITHUB_REPOSITORY" -w tms.yml -L 5 --json status -q '[.[] | select(.status != "completed")] | length')
              if [ "$busy" = "0" ]; then break; fi
              if [ "$i" = 1 ]; then echo "tms.yml の周が終わるまで待つ"; fi
              restart=1
              sleep 10
            done
            names=$(node -e "import('./scripts/core/_readme.mjs').then(({readAccounts})=>{console.log((readAccounts()['775']||[]).filter((a)=>a.kind==='vms'&&a.note==='VIP').map((a)=>a.name).join(','))})")
            node scripts/core/shield.mjs "$names" || true
            if [ "$morning" = "true" ] || [ "$(TZ=JST-9 date +%H)" -lt 12 ]; then
              node scripts/core/vip_unlock.mjs "$names" || true
              node scripts/core/vip_store.mjs "$names" || true
              node scripts/core/use_skill.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
              node scripts/core/vip_boost.mjs "$names" --train-zombie || true
              node scripts/core/train_army.mjs "$names" --zombie-only || true
              node work/leave_alliance.mjs "$names" || true
              node scripts/core/join_alliance.mjs "$names" || true
              node scripts/core/vip_send.mjs "$names" || true
              node work/leave_alliance.mjs "$names" || true
              node scripts/core/join_alliance.mjs "$names" --leader=Empire064d8775 || true
              restart=1
            else
              node scripts/core/train_army.mjs "$names" --zombie-only || true
            fi
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node work/gold_shield775.mjs "$names" || true
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-tms でダイヤを読み、accounts.json を更新する'))"
            if [ -n "$restart" ]; then
              echo "tms.yml を起動する"
              gh workflow run tms.yml -R "$GITHUB_REPOSITORY" || true
            fi
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
