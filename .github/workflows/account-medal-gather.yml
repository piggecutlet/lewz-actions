on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      dry_run:
        default: "true"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/medal_gather.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          dry_run=$(jq -r '.inputs.dry_run // "true"' "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          case "$dry_run" in
            true | false) ;;
            *) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/medal_gather.mjs "$names" "$dry_run"
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
