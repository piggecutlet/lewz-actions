on:
  workflow_dispatch:
    inputs:
      gift_only:
        description: 回す表示名をカンマ区切り（空なら Empire062775）
        required: false
        default: ""

concurrency:
  group: core-hunt-gift
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GIFT_ONLY: ${{ inputs.gift_only }}
        run: |
          case "$GIFT_ONLY" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/core_hunt_gift.mjs ${GIFT_ONLY:+"--gift-only=$GIFT_ONLY"}
          }
          . .github/scripts/logged.sh
          start_logged main
          code=$CODE
          if [ $code -eq 3 ]; then
            echo "timeout=1" >> "$GITHUB_ENV"
            code=0
          fi
          exit $code

      - name: 時間切れ
        if: env.timeout == '1'
        run: echo "時間切れ"

      - if: always()
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] && [ -d src ] || exit 0
          (
            cd src
            node scripts/core/core_hunt_gift.mjs --push
          ) >> "$LOG" 2>&1 || true

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] || exit 0
          . .github/scripts/logged.sh
          CODE=0
          finish_logged

  next:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || github.token }}
          GIFT_ONLY: ${{ inputs.gift_only }}
        run: |
          n=""
          for i in 1 2 3 4 5; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[].steps[] | select(.name == "時間切れ" and .conclusion == "success")] | length') && break
            n=""
            echo "run の結果を読めなかったので 30 秒後にやり直す（$i 回目）"
            sleep 30
          done
          if [ -z "$n" ]; then
            echo "run の結果を 5 回とも読めなかった"
            exit 1
          fi
          if [ "$n" -gt 0 ]; then
            for i in 1 2 3 4 5; do
              if gh workflow run core-hunt-gift.yml -R "$GITHUB_REPOSITORY" -f gift_only="$GIFT_ONLY"; then
                echo "続きを起動した"
                exit 0
              fi
              echo "続きを起動できなかったので 30 秒後にやり直す（$i 回目）"
              sleep 30
            done
            echo "続きを 5 回とも起動できなかった"
            exit 1
          fi
