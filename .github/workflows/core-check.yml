on:
  workflow_dispatch:
    inputs:
      kind:
        description: 読む kind（カンマ区切り）
        default: core,sng,other,cnl
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout: |
            api
            scripts/core
            savedata

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          kind=$(jq -r '.inputs.kind // "core,sng,other,cnl"' "$GITHUB_EVENT_PATH")
          case "$kind" in
            "" | *[!a-z,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/core_check.mjs --kind="$kind" --state="$STATE"
          }
          . .github/scripts/logged.sh
          start_logged main
          exit $CODE

      - if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          [ -n "$LOG" ] && [ -f "$LOG" ] || exit 0
          . .github/scripts/logged.sh
          CODE=0
          finish_logged
