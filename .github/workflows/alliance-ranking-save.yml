on:
  workflow_dispatch:
    inputs:
      name:
        description: ログインする gameUid
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/alliance_rank_save.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            code=0
            node scripts/ci/alliance_rank_save.mjs "$name" || code=1
            git add savedata/alliances.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI で同盟の順位（alliances.json）を更新する"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
