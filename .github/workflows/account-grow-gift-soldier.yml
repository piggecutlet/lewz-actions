on:
  workflow_dispatch:
    inputs:
      arm:
        type: choice
        default: 既定
        options:
          - 既定
          - Lv.10 ゾンビ
          - Lv.10 戦士
          - Lv.10 車両
          - Lv.10 射手
          - Lv.10 車両,Lv.10 射手,Lv.10 戦士
      no_alliance:
        description: 自分の同盟に入れずに訓練する
        type: boolean
        default: false
      old:
        description: grow-army の印が無い昔の setup の件を使う
        type: boolean
        default: false
      count:
        description: 使う件数（空なら amount から決める）
        required: false
        default: ""
      amount:
        description: 作る体数の目安
        default: "10000000"
      dry_run:
        type: boolean
        default: false
      state:
        description: 州
        default: "775"

concurrency:
  group: grow-gift-soldier-${{ inputs.no_alliance }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/grow_gift_soldier.mjs
            /scripts/ci/leave_alliance.mjs
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          GH_TOKEN: ${{ secrets.LEWZ_GITHUB_PAT }}
          ARM: ${{ inputs.arm }}
          AMOUNT: ${{ inputs.amount }}
          COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          NO_ALLIANCE: ${{ inputs.no_alliance && '--no-alliance' || '' }}
          OLD: ${{ inputs.old && '--old' || '' }}
          NO_ALLIANCE_INPUT: ${{ inputs.no_alliance }}
          OLD_INPUT: ${{ inputs.old }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$AMOUNT$COUNT$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            me=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
            while [ "$(gh run list -R "$GITHUB_REPOSITORY" -w account-grow-army.yml -s in_progress --json createdAt -q "[.[] | select(.createdAt < \"$me\")] | length")" != 0 ]; do
              echo "account-grow-army.yml が終わるまで待つ"
              sleep 60
            done
            node --max-old-space-size=8192 scripts/ci/grow_gift_soldier.mjs --arm="$ARM" ${COUNT:+"--count=$COUNT"} ${AMOUNT:+"--amount=$AMOUNT"} --state="$STATE" $NO_ALLIANCE $OLD $DRY_RUN
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の grow-gift-soldier で accounts.json を更新する'))"
            if [ "$code" = 3 ]; then
              echo "使える件が 0 件なので次の account-grow-gift-soldier.yml を起動しない"
              exit 0
            fi
            if [ "$code" = 0 ] && [ -z "$DRY_RUN" ]; then
              gh workflow run account-grow-gift-soldier.yml -R "$GITHUB_REPOSITORY" -f arm="$ARM" -f count="$COUNT" -f amount="$AMOUNT" -f state="$STATE" -f no_alliance="$NO_ALLIANCE_INPUT" -f old="$OLD_INPUT" && echo "次の account-grow-gift-soldier.yml を起動した"
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
