on:
  workflow_dispatch:
    inputs:
      name:
        description: 使う自動アカウントの表示名
        required: true
      list:
        description: 入らずに空きのある小隊の一覧だけ出す
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LIST: ${{ inputs.list }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          opt=""
          if [ "$LIST" = "true" ]; then
            opt="--list"
          fi
          main() {
            cd src && node scripts/core/team_scout.mjs "$name" $opt
          }
          . .github/scripts/logged.sh
          run_logged main
