on:
  workflow_dispatch:
    inputs:
      name:
        description: 表示名
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          target=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[A-Za-z0-9]+$ ]] || exit 1
          main() {
            cd src && node scripts/core/item_buy_check.mjs "$target"
          }
          . .github/scripts/logged.sh
          run_logged main
