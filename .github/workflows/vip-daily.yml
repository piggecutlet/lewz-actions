on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名（省くと備考が VIP の自動アカウントの全件）
        required: false
      morning:
        description: 時刻に関係なく 9 時の回（解禁・商店・加速・派遣）を流す
        type: boolean
        default: false
      only_send_lv10_zombie:
        description: 送るのを Lv.10 ゾンビ ネメシスだけにする（1 万体に足りなければ送らない）
        type: boolean
        default: false
      state:
        description: 州
        default: "775"
      store:
        description: VIP 商店も回す表示名（空なら 775 は Empire062775、ほかの州は回さない）
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml
            /scripts/ci/diamond_shield_read.mjs

      - timeout-minutes: 120
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          STORE: ${{ inputs.store }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$STORE" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          store="$STORE"
          if [ -z "$store" ] && [ "$STATE" = 775 ]; then
            store=Empire062775
          fi
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          morning=$(jq -r '.inputs.morning // "false"' "$GITHUB_EVENT_PATH")
          only_zombie=$(jq -r '.inputs.only_send_lv10_zombie // "false"' "$GITHUB_EVENT_PATH")
          send_opt=""
          if [ "$only_zombie" = "true" ]; then
            send_opt="--only-send-lv10-zombie"
          fi
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ -z "$names" ]; then
              names=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.kind===KIND.AUTO&&a.note==='VIP').map((a)=>a.name).join(','))})" "$STATE")
            fi
            node scripts/core/shield.mjs "$names" || true
            node scripts/core/vip_unlock.mjs "$names" || true
            if [ "$morning" = "true" ] || [ "$(TZ=JST-9 date +%H)" -lt 12 ]; then
              node scripts/core/vip_store.mjs "$names" || true
              if [ -n "$store" ]; then
                node scripts/core/vip_store.mjs "$store" || true
              fi
              node scripts/core/use_skill.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" || true
              node scripts/core/vip_boost.mjs "$names" || true
              node scripts/core/train_army.mjs "$names" || true
              if [ "$(TZ=JST-9 date +%F)" != "2026-10-18" ]; then
                node scripts/core/vip_send.mjs "$names" $send_opt || true
              fi
            else
              node scripts/core/train_army.mjs "$names" || true
            fi
            node scripts/ci/diamond_shield_read.mjs "$names" --state="$STATE" || true
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip でダイヤを読み、accounts.json を更新する'))"
          }
          . .github/scripts/logged.sh
          run_logged main
