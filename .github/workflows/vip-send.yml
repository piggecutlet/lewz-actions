on:
  workflow_dispatch:
    inputs:
      names:
        description: 表示名（カンマ区切り。省くと備考が VIP の自動アカウントの全件）
        required: false
      state:
        description: 州（表示名を省いたときの州）
        default: "775"
      only_send_lv10_zombie:
        description: Lv.10 ゾンビ ネメシスだけを 1 万体まで作って贈る
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /scripts/skip/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml

      - timeout-minutes: 120
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          names=$(jq -r '.inputs.names // ""' "$GITHUB_EVENT_PATH")
          case "$names" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            if [ -z "$names" ]; then
              names=$(node -e "Promise.all([import('./scripts/core/_readme.mjs'),import('./scripts/core/_kinds.mjs')]).then(([{readAccounts},{KIND}])=>{console.log((readAccounts()[process.argv[1]]||[]).filter((a)=>a.kind===KIND.AUTO&&a.note==='VIP').map((a)=>a.name).join(','))})" "$STATE")
            fi
            boost_opt=""
            send_opt=""
            if [ "$(jq -r '.inputs.only_send_lv10_zombie // "false"' "$GITHUB_EVENT_PATH")" = "true" ]; then
              boost_opt="--zombie-only"
              send_opt="--only-send-lv10-zombie"
            fi
            node scripts/core/vip_boost.mjs "$names" $boost_opt || true
            node scripts/core/vip_send.mjs "$names" $send_opt
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-send で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
