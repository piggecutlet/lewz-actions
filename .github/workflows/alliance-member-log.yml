on:
  workflow_dispatch:
    inputs:
      name:
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/al_event.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          name=$(jq -r .inputs.name "$GITHUB_EVENT_PATH")
          case "$name" in
            "" | *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/al_event.mjs "$name"
            exit $?
          }
          . .github/scripts/logged.sh
          run_logged main
