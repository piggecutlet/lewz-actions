on:
  workflow_dispatch:
    inputs:
      names:
        required: true
      target:
        description: 発射台の座標（x,y）
        default: "600,600"
      teleport:
        description: 近くへ移転（高級移転が無ければダイヤ）
        type: boolean
        default: false
      go:
        description: 1 部隊ずつ出兵する
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/obb/assets/WorldMap.tmx

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          TELEPORT: ${{ inputs.teleport }}
          GO: ${{ inputs.go }}
        run: |
          names=$(jq -r .inputs.names "$GITHUB_EVENT_PATH")
          case "$names" in
            "" | *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          target=$(jq -r '.inputs.target // "600,600"' "$GITHUB_EVENT_PATH")
          [[ "$target" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          main() {
            cd src
            code=0
            if [ "$TELEPORT" = "true" ]; then
              node scripts/core/teleport_near.mjs "$target" "$names" --diamond || code=1
            fi
            if [ $code -eq 0 ]; then
              node scripts/core/attack.mjs "$names" --target="$target" || code=1
            fi
            if [ $code -eq 0 ] && [ "$GO" = "true" ]; then
              node scripts/core/attack.mjs "$names" --target="$target" --go || code=1
            fi
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の launch-pad で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
