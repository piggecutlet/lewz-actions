on:
  workflow_dispatch:
    inputs:
      login:
        description: ログインする gameUid
        required: true
      state:
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/user_info.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          login=$(jq -r .inputs.login "$GITHUB_EVENT_PATH")
          state=$(jq -r '.inputs.state // ""' "$GITHUB_EVENT_PATH")
          case "$login" in
            "" | *[!0-9]*) exit 1 ;;
          esac
          case "$state" in
            *[!0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/user_info.mjs "$login" ${state:+--state=$state}
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
