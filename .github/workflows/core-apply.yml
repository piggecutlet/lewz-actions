on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - apply
          - watch
          - cancel
        default: watch
      name:
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false
      to:
        type: string
        default: ""
      state:
        description: 州
        default: "775"
      mine:
        description: 申請先から除く同盟の略称をカンマ区切り（空なら 775 は CNL,SCP,SNG。alliances.json の自分の同盟はいつも除く。ほかの州は必須）
        type: string
        default: ""

concurrency:
  group: core-apply${{ inputs.mode == 'cancel' && '-cancel' || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /documents/human/

      - env:
          MODE: ${{ inputs.mode }}
          NAME: ${{ inputs.name }}
          TO: ${{ inputs.to }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          MINE: ${{ inputs.mine }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$MINE" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          case "$MODE" in
            apply | watch) NAME="" ;;
            cancel) [ -n "$NAME" ] || exit 1 ;;
            *) exit 1 ;;
          esac
          case "$TO" in
            *[!A-Za-z0-9,:]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/core/core_apply.mjs "$MODE" $NAME ${TO:+"--to=$TO"} $DRY_RUN --ci --state="$STATE" ${MINE:+"--mine=$MINE"}
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set +e
          if [ -z "$DRY_RUN" ]; then
            (
              cd src
              node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の core-apply で accounts.json を更新する'))"
            ) >> "$LOG" 2>&1
          fi
          set -e
          . .github/scripts/logged.sh
          finish_logged
