on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - apply
          - watch
          - cancel
        default: watch
      name:
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false
      to:
        type: string
        default: ""
      state:
        description: 州
        default: "775"
      mine:
        description: 申請先から除く同盟の略称をカンマ区切り（空なら 775 は CMP,CNL,TMS,SCP,SNG。ほかの州は必須）
        type: string
        default: ""

concurrency:
  group: core-apply${{ inputs.mode == 'cancel' && '-cancel' || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /documents/human/

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          MODE: ${{ inputs.mode }}
          NAME: ${{ inputs.name }}
          TO: ${{ inputs.to }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
          MINE: ${{ inputs.mine }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          case "$MINE" in
            *[!A-Za-z0-9,]*) exit 1 ;;
          esac
          case "$MODE" in
            apply | watch) NAME="" ;;
            cancel) [ -n "$NAME" ] || exit 1 ;;
            *) exit 1 ;;
          esac
          case "$TO" in
            *[!A-Za-z0-9,:]*) exit 1 ;;
          esac
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_core-apply_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          echo "LOG=$log" >> "$GITHUB_ENV"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            node scripts/core/core_apply.mjs "$MODE" $NAME ${TO:+"--to=$TO"} $DRY_RUN --ci --state="$STATE" ${MINE:+"--mine=$MINE"}
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          echo "CODE=$?" >> "$GITHUB_ENV"

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set +e
          if [ -z "$DRY_RUN" ]; then
            (
              cd src
              node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の core-apply で accounts.json を更新する'))"
            ) >> "$LOG" 2>&1
          fi
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$LOG" -out "${LOG%.log}"
          rm "$LOG"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit "${CODE:-1}"
