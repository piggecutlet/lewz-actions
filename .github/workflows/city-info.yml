on:
  workflow_dispatch:
    inputs:
      points:
        description: 足す都市の座標（x,y をスペース区切り。空なら状態だけ最新にする）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /documents/都市.md
            /device/files/WarZDoc/config/database.local.xml
            /device/files/WarZDoc/config/text_ja.ini
            /device/files/WarZDoc/config/totalwar.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          points=$(jq -r '.inputs.points // ""' "$GITHUB_EVENT_PATH")
          for p in $points; do
            [[ "$p" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          done
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)_city-info_${GITHUB_RUN_ID}.log"
          set +e
          (
            cd src
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p app/assets/WarZResources/local
            cp device/files/WarZDoc/config/database.local.xml device/files/WarZDoc/config/text_ja.ini app/assets/WarZResources/local/
            code=0
            for p in $points; do
              node scripts/core/city_info.mjs "$p" --write || code=1
            done
            node scripts/core/city_status.mjs || code=1
            npx --yes prettier@3 --write documents/都市.md
            git add documents/都市.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: CI で都市の表を更新する"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w0
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "$log.enc"
          rm "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
