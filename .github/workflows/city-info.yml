on:
  workflow_dispatch:
    inputs:
      points:
        description: 足す都市の座標（x,y をスペース区切り。空なら表の値と状態を最新にするだけ）
        required: false
        default: ""
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/WarZDoc/config/database.local.xml
            /decompile/device/files/WarZDoc/config/text_ja.ini
            /decompile/device/files/WarZDoc/config/totalwar.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          points=$(jq -r '.inputs.points // ""' "$GITHUB_EVENT_PATH")
          for p in $points; do
            [[ "$p" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          done
          main() {
            cd src
            mkdir -p decompile/app/assets/WarZResources/local
            cp decompile/device/files/WarZDoc/config/database.local.xml decompile/device/files/WarZDoc/config/text_ja.ini decompile/app/assets/WarZResources/local/
            code=0
            node scripts/core/city_info.mjs $points --write --state="$STATE" || code=1
            git add savedata/cities.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI で都市の表（cities.json）を更新する"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
            exit $code
          }
          . .github/scripts/logged.sh
          run_logged main
