on:
  workflow_dispatch:
    inputs:
      points:
        description: 足す都市の座標（x,y をスペース区切り。空なら表の値と状態を最新にするだけ）
        required: false
        default: ""
      state:
        description: 州
        default: "775"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > "$HOME/sign_key"
          chmod 600 "$HOME/sign_key"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/sign_key"
          if ssh-keygen -y -P "" -f "$HOME/sign_key" > /dev/null; then git config --global commit.gpgsign true; fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/WarZDoc/config/database.local.xml
            /decompile/device/files/WarZDoc/config/text_ja.ini
            /decompile/device/files/WarZDoc/config/totalwar.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          STATE: ${{ inputs.state || '775' }}
        run: |
          case "$STATE" in
            *[!0-9]*) exit 1 ;;
          esac
          points=$(jq -r '.inputs.points // ""' "$GITHUB_EVENT_PATH")
          for p in $points; do
            [[ "$p" =~ ^[0-9]+,[0-9]+$ ]] || exit 1
          done
          mkdir -p logs
          log="logs/$(TZ=Asia/Tokyo date +%Y/%m/%d/%H%M%S)_city-info_${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          set +e
          (
            cd src
            git config user.name "piggecutlet"
            git config user.email "234113501+piggecutlet@users.noreply.github.com"
            mkdir -p decompile/app/assets/WarZResources/local
            cp decompile/device/files/WarZDoc/config/database.local.xml decompile/device/files/WarZDoc/config/text_ja.ini decompile/app/assets/WarZResources/local/
            code=0
            node scripts/core/city_info.mjs $points --write --state="$STATE" || code=1
            git add savedata/cities.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: CI で都市の表（cities.json）を更新する"
              for i in 1 2 3 4 5; do
                git pull --rebase && git push && break
                sleep $((RANDOM % 20 + 5))
              done
            fi
            exit $code
          ) > "$log" 2>&1 &
          pid=$!
          n=0
          while kill -0 "$pid" 2>/dev/null; do
            sleep 10
            n=$((n + 1))
            if [ $((n % 30)) -eq 0 ]; then
              tail -n 30 "$log" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY | base64 -w 1000
              echo
            fi
          done
          wait "$pid"
          code=$?
          set -e
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in "$log" -out "${log%.log}"
          rm "$log"
          git config user.name "piggecutlet"
          git config user.email "234113501+piggecutlet@users.noreply.github.com"
          git add logs
          git commit -m "logs"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 20 + 5))
          done
          exit $code
