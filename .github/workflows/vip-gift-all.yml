on:
  workflow_dispatch:
    inputs:
      alliance:
        description: 同盟の ID をカンマ区切り（空なら 775_001 → 775_002 → 775_003 → 775_004 → 775_005）
        required: false
        default: ""
      count:
        description: 先頭からこの件数だけ（空なら全件）
        required: false
        default: ""
      retry:
        description: kind vip にした件でもダイヤが 5,000 以上残っていればもう一度回す
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: vip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.activity.xml
            /scripts/ci/leave_alliance.mjs

      - env:
          GH_TOKEN: ${{ github.token }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          alliance=$(jq -r '.inputs.alliance // ""' "$GITHUB_EVENT_PATH")
          count=$(jq -r '.inputs.count // ""' "$GITHUB_EVENT_PATH")
          case "$alliance" in
            *[!0-9_,]*) exit 1 ;;
          esac
          case "$count" in
            *[!0-9]*) exit 1 ;;
          esac
          opts=()
          if [ -n "$alliance" ]; then opts+=("--alliance=$alliance"); fi
          if [ -n "$count" ]; then opts+=("--count=$count"); fi
          if [ "$(jq -r '.inputs.retry // "false"' "$GITHUB_EVENT_PATH")" = "true" ]; then opts+=("--retry"); fi
          main() {
            busy=$(gh run list -R "$GITHUB_REPOSITORY" -w account-setup.yml -L 5 --json status -q '[.[] | select(.status != "completed")] | length')
            if [ "$busy" != "0" ]; then
              echo "account-setup.yml が動いているので贈らない。止めてから実行してください"
              exit 1
            fi
            cd src
            node scripts/core/vip_gift_all.mjs "${opts[@]}"
            code=$?
            node -e "import('./scripts/core/_ci.mjs').then(({pushAccounts})=>pushAccounts('chore: CI の vip-gift-all で accounts.json を更新する'))"
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
