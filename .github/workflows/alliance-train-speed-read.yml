on:
  workflow_dispatch:
    inputs:
      name:
        description: gameUid（既定は Empire0fc1d775）
        default: 645412375000775
      ids:
        description: 科学技術 ID をカンマ区切りで（all で全件）
        default: 259000,259100

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/train_time_read.mjs
            /scripts/ci/science_state.mjs
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.local.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          NAME: ${{ inputs.name || '645412375000775' }}
          IDS: ${{ inputs.ids || '259000,259100' }}
        run: |
          case "$NAME" in
            *[!0-9]*) exit 1 ;;
          esac
          [ "$IDS" = all ] && IDS=
          case "$IDS" in
            *[!0-9,]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/train_time_read.mjs "$NAME"
            code=$?
            node scripts/ci/science_state.mjs "$NAME" $IDS || code=1
            exit $code
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
