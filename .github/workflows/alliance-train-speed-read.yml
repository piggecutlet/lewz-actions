on:
  workflow_dispatch:
    inputs:
      name:
        description: 表示名
        default: Empire04c3b775

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.SOURCE_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/
            /scripts/core/
            /savedata/
            /scripts/ci/train_time_read.mjs
            /scripts/ci/science_state.mjs
            /decompile/device/files/ja/ja_ilocalize_base.json
            /decompile/device/files/WarZDoc/config/database.local.xml

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          NAME: ${{ inputs.name || 'Empire04c3b775' }}
        run: |
          case "$NAME" in
            *[!A-Za-z0-9]*) exit 1 ;;
          esac
          main() {
            cd src
            node scripts/ci/train_time_read.mjs "$NAME"
            node scripts/ci/science_state.mjs "$NAME" 259000,259100
          }
          . .github/scripts/logged.sh
          run_logged main
