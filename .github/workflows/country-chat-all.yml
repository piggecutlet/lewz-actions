on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: country-chat-all

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          source-repo: ${{ secrets.SOURCE_REPO }}
          source-token: ${{ secrets.LEWZ_GITHUB_PAT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/core/_miniws.mjs
            /scripts/core/server_list.json
            /scripts/ci/country_chat_all.mjs

      - env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          main() {
            cd src && node scripts/ci/country_chat_all.mjs
          }
          . .github/scripts/logged.sh
          start_logged main

      - if: always() && env.LOG != ''
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . .github/scripts/logged.sh
          finish_logged
